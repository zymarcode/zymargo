<style>
  :root{ --bg:#0f0f12; --red:#e50914; --red-hover:#f6121d; --red-glow:rgba(229,9,20,.35); --muted:#8a8a92; --border:#26262c; --spotify:#1db954; --spotify-hover:#1ed760; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes markIn{
    from{ opacity:0; transform:scale(.6) rotate(-8deg); }
    to{ opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  body{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  body::before{
    background-position:center; background-size:cover;
    transform:scale(1.08);
  }
  body::after{
    background:
      radial-gradient(ellipse at 20% 20%, rgba(229,9,20,0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, rgba(229,9,20,0.12) 0%, transparent 45%),
      rgba(10,10,13,0.5);
  }
  .login-card{
    position:relative; z-index:1;
    background:rgba(15,15,18,0.85);
    padding:clamp(20px,5vw,32px) clamp(16px,4vw,28px);
    border-radius:12px;
    border:1px solid var(--border);
    width:100%; max-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
    margin:16px;
    animation:cardIn .5s cubic-bezier(.2,.8,.2,1);
  }
  .brand{ display:flex; align-items:center; gap:9px; margin-bottom:20px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; flex:0 0 auto; overflow:hidden;
    background:linear-gradient(135deg, var(--red), var(--red-hover));
    display:flex; align-items:center; justify-content:center; font-size:17px;
    box-shadow:0 5px 14px rgba(229,9,20,.4);
    animation:markIn .5s .1s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .brand-mark img{ display:block; width:100%; height:100%; object-fit:cover; border-radius:9px; }
  .brand-info{ min-width:0; }
  .brand-title{ font-size:15px; font-weight:900; color:#fff; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h1{ font-size:15px; margin:0 0 16px; font-weight:600; color:#fff; }
  .field{ margin-bottom:11px; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .input-wrap{ position:relative; }
  .input-wrap svg.icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; fill:var(--muted); pointer-events:none; transition:.15s;
  }
  input[type=text], input[type=password]{
    width:100%; padding:11px 11px 11px 36px; border-radius:7px; border:1px solid var(--border);
    background:#131317; color:#fff; font-size:13px; transition:.15s;
  }
  input:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--red-glow); }
  .input-wrap:focus-within svg.icon{ fill:var(--red); }
  .toggle-pass{
    position:absolute; right:9px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border:none; background:transparent; color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:6px;
  }
  .toggle-pass:hover{ color:#fff; background:#1c1c20; }
  .toggle-pass svg{ width:14px; height:14px; fill:currentColor; }
  button{
    width:100%; padding:11px; border:none; border-radius:7px;
    background:linear-gradient(135deg, var(--red), var(--red-hover)); color:#fff; font-size:14px; font-weight:700; cursor:pointer; margin-top:6px;
    transition:.2s; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(229,9,20,.45); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:.75; cursor:not-allowed; transform:none; }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:spin .7s linear infinite; display:none;
  }
  button.loading .spinner{ display:inline-block; }
  .error{ color:#ff6b6b; font-size:13px; margin-top:12px; min-height:16px; }
  .error.show{ animation:shake .4s; }
  .hint{ color:var(--muted); font-size:12px; margin-top:22px; text-align:center; line-height:1.5; }

  /* --- Tarjeta de credenciales demo (llamativa) --- */

  }

  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 2px rgba(46,204,113,.25); }

  }
  .creds-row{
    display:flex; align-items:center; justify-content:space-between; gap:6px;

  .creds-label{ font-size:7.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:1px; }
  .creds-value{ font-family:'SFMono-Regular',Consolas,Menlo,monospace; font-size:11px; font-weight:700; color:#fff; word-break:break-all; }
  .creds-copy{

  .creds-copy:hover{ background:var(--red); border-color:transparent; color:#fff; }
  .creds-copy svg{ width:10px; height:10px; fill:currentColor; }
  .creds-copy.copied{ background:#2ecc71; border-color:transparent; color:#0f0f12; }
  .creds-note{ margin-top:6px; font-size:9px; color:var(--muted); text-align:center; line-height:1.4; }

<body>
<!-- ===== LOADING ===== -->
<style>
#sfLoad{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 38%,#3a0609 0%,#14070a 45%,#050506 100%);transition:opacity .45s ease,visibility .45s ease;overflow:hidden}
#sfLoad::before{content:"";position:absolute;left:50%;top:38%;width:min(520px,90vw);height:min(520px,90vw);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(229,9,20,.28) 0%,rgba(229,9,20,0) 65%);animation:sfGlow 2.2s ease-in-out infinite;pointer-events:none}
#sfLoad.sfHide{opacity:0;visibility:hidden}
#sfLoad .sfMark{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
#sfLoad .sfMark::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(229,9,20,.18)}
#sfLoad .sfMark::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#e50914;border-right-color:#ff2a35;box-shadow:0 0 22px rgba(229,9,20,.55);animation:sfRot 1s linear infinite}
#sfLoad .sfLogo{width:72px;height:72px;object-fit:contain;border-radius:16px;animation:sfPulse 1.4s ease-in-out infinite}
#sfLoad .sfName{margin:0;font-size:clamp(30px,9vw,54px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:0 16px;
  color:#e50914;background:linear-gradient(100deg,#b20710 20%,#ff2a35 40%,#fff 50%,#ff2a35 60%,#b20710 80%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sfShine 1.8s linear infinite;text-shadow:none}
#sfLoad .sfBar{width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(229,9,20,.18);overflow:hidden}
#sfLoad .sfBar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#b20710,#e50914,#ff2a35);box-shadow:0 0 12px rgba(229,9,20,.8);animation:sfSlide 1.1s ease-in-out infinite}
@keyframes sfShine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes sfSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes sfPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
@keyframes sfRot{to{transform:rotate(360deg)}}
@keyframes sfGlow{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){#sfLoad .sfName,#sfLoad .sfBar i,#sfLoad .sfLogo,#sfLoad .sfMark::after,#sfLoad::before{animation:none}}
</style>
<div id="sfLoad">
<div class="sfMark"><? if (brand.brandLogoUrl) { ?><img class="sfLogo" src="<?= brand.brandLogoUrl ?>" alt="" onerror="this.style.display='none'"><? } ?></div>
  <h1 class="sfName"><?= brand.brandName ?></h1>
  <div class="sfBar"><i></i></div>
</div>
<script>
(function(){
  var t0 = Date.now(), el = document.getElementById("sfLoad"), done = false;
  function hide(){
    if (done || !el) return; done = true;
    var wait = Math.max(0, 600 - (Date.now() - t0));
    setTimeout(function(){
      el.className = "sfHide";
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 600);
    }, wait);
  }
  if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
  setTimeout(hide, 8000);
})();
</script>

          <a href="<?= brand.socialInstagramUrl ?>" target="_blank" rel="noopener" title="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 2 .3 2.4.5.6.2 1 .5 1.5 1 .4.4.7.9 1 1.5.2.5.4 1.2.5 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 2-.5 2.4-.2.6-.6 1-1 1.5-.5.4-.9.7-1.5 1-.5.2-1.2.4-2.4.5-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-2-.3-2.4-.5-.6-.3-1-.6-1.5-1-.4-.5-.8-.9-1-1.5-.3-.5-.4-1.2-.5-2.4-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.2-2 .5-2.4.2-.6.6-1 1-1.5.5-.4.9-.8 1.5-1 .5-.2 1.2-.4 2.4-.5 1.3-.1 1.7-.1 4.9-.1Zm0 1.8c-3.2 0-3.5 0-4.7.1-1 0-1.6.2-1.9.4-.5.1-.8.3-1.2.7-.3.3-.5.6-.7 1.1-.2.4-.3 1-.4 2-.1 1.1-.1 1.4-.1 4.7s0 3.5.1 4.7c0 1 .2 1.6.4 2 .2.4.4.8.7 1.1.4.3.7.5 1.2.7.3.1.9.3 1.9.4 1.2 0 1.5.1 4.7.1s3.5 0 4.7-.1c1-.1 1.6-.2 2-.4.4-.2.8-.4 1.1-.7.3-.3.5-.6.7-1.1.2-.4.3-1 .4-2 .1-1.2.1-1.5.1-4.7s0-3.5-.1-4.7c-.1-1-.2-1.6-.4-2-.2-.4-.4-.8-.7-1.1-.3-.4-.7-.6-1.1-.7-.4-.2-1-.4-2-.4-1.2-.1-1.5-.1-4.7-.1Zm0 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 1.8a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4Zm5.6-2a1 1 0 1 1-2.1 0 1 1 0 0 1 2 0Z"/></svg></a>
        <? } ?>
      </div>
    <? } ?>
  </div>

<script>
  var BASE_URL = "<?= baseUrl ?>";

  // Identificador propio de ESTE navegador. Vive en localStorage,
  // nunca viaja en la URL, así que copiar el link a otro navegador
  // no copia este identificador (ver checkSessionDevice en Admin/Usuario).
  function getDeviceId_(){
    var KEY = 'sf_device_id';
    try {
      var id = localStorage.getItem(KEY);
      if(!id){
        id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,12);
        localStorage.setItem(KEY, id);
      }
      return id;
    } catch(e){
      try {
        var sid = sessionStorage.getItem(KEY);
        if(!sid){
          sid = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,12);
          sessionStorage.setItem(KEY, sid);
        }
        return sid;
      } catch(e2){
        return 'dev_nostorage_' + Date.now().toString(36);
      }
    }
  }

  function login(){
    var usuario = document.getElementById('usuario').value.trim();
    var pass = document.getElementById('pass').value;
    var btn = document.getElementById('btn');
    var btnLabel = document.getElementById('btnLabel');
    var err = document.getElementById('err');
    err.textContent = ''; err.classList.remove('show');

    if(!usuario || !pass){ showError('Completa todos los campos.'); return; }

    btn.disabled = true; btn.classList.add('loading'); btnLabel.textContent = 'Verificando...';

    google.script.run
      .withSuccessHandler(function(res){
        if(res.ok){
          btnLabel.textContent = '¡Listo!';
          window.top.location.href = BASE_URL + '?page=login&utoken=' + res.token;
        } else {
          btn.disabled = false; btn.classList.remove('loading'); btnLabel.textContent = 'Entrar';
          showError(res.error || 'Error al iniciar sesión.');
        }
      })
      .withFailureHandler(function(e){
        btn.disabled = false; btn.classList.remove('loading'); btnLabel.textContent = 'Entrar';
        showError('Error: ' + e.message);
      })
      .verifyUserLogin(usuario, pass, getDeviceId_());
  }

  function showError(msg){
    var err = document.getElementById('err');
    err.textContent = msg;
    err.classList.remove('show'); void err.offsetWidth; err.classList.add('show');
  }

  var togglePass = document.getElementById('togglePass');
  if(togglePass){
    togglePass.addEventListener('click', function(){
      var p = document.getElementById('pass');
      p.type = (p.type === 'password') ? 'text' : 'password';
    });
  }

  document.getElementById('pass').addEventListener('keydown', function(e){
    if(e.key === 'Enter') login();
  });

  // --- Construye la tarjeta de credenciales demo a partir de brand.loginHintText ---
  (function renderHint(){
    var wrap = document.getElementById('loginHintWrap');
    if(!wrap) return;
    var raw = (wrap.getAttribute('data-hint') || '').trim();
    if(!raw) return;

    // Intenta reconocer "Usuario: xxx Contraseña: yyy" (con o sin acento, mayúsculas, etc.)
    var m = raw.match(/usuario\s*:?\s*([^\s]+)[\s,;-]+contrase[ñn]a\s*:?\s*([^\s]+)/i);

    if(m){
      var user = m[1], passw = m[2];
      var copyIcon = '<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>';
      var checkIcon = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

      wrap.innerHTML =
        '<div class="creds">' +
          '<div class="creds-inner">' +
            '<div class="creds-title"><span class="dot"></span>Cuenta de prueba gratuita</div>' +
            '<div class="creds-row">' +
              '<div><div class="creds-label">Usuario</div><div class="creds-value" id="hintUser">' + user + '</div></div>' +
              '<button type="button" class="creds-copy" data-copy="' + user + '" title="Copiar usuario">' + copyIcon + '</button>' +
            '</div>' +
            '<div class="creds-row">' +
              '<div><div class="creds-label">Contraseña</div><div class="creds-value" id="hintPass">' + passw + '</div></div>' +
              '<button type="button" class="creds-copy" data-copy="' + passw + '" title="Copiar contraseña">' + copyIcon + '</button>' +
            '</div>' +
            '<div class="creds-note">Toca para copiar 🍿</div>' +
          '</div>' +
        '</div>';

      wrap.querySelectorAll('.creds-copy').forEach(function(btn){
        btn.addEventListener('click', function(){ copyToClipboard(btn.getAttribute('data-copy'), btn, checkIcon, copyIcon); });
      });
      wrap.querySelectorAll('.creds-value').forEach(function(val){
        val.style.cursor = 'pointer';
        val.addEventListener('click', function(){
          var btn = val.parentNode.parentNode.querySelector('.creds-copy');
          copyToClipboard(val.textContent, btn, checkIcon, copyIcon);
        });
      });

      // Autocompleta los campos de login para que sea aún más fácil entrar
      var uInput = document.getElementById('usuario');
      var pInput = document.getElementById('pass');
      if(uInput && !uInput.value) uInput.value = user;
      if(pInput && !pInput.value) pInput.value = passw;
    } else {
      // Formato no reconocido: se muestra como texto simple, como antes
      var p = document.createElement('p');
      p.className = 'hint';
      p.id = 'loginHint';
      p.textContent = raw;
      wrap.appendChild(p);
    }
  })();

  function copyToClipboard(text, btn, checkIcon, copyIcon){
    function done(){
      if(!btn) return;
      btn.classList.add('copied');
      btn.innerHTML = checkIcon;
      setTimeout(function(){ btn.classList.remove('copied'); btn.innerHTML = copyIcon; }, 1200);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      done();
    }
  }
</script>
</body>
</html>
