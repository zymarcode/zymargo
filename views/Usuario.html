  function pcUpdateProgress(){
    if(!pcVideo) return;
    if(!isFinite(pcVideo.duration) || pcIsLive){
      document.getElementById('pcCurrent').textContent = fmtTime(pcVideo.currentTime);
      return;
    }
    var pct = (pcVideo.currentTime / pcVideo.duration) * 100;
    document.getElementById('pcFill').style.width = pct + '%';
    document.getElementById('pcThumb').style.left = pct + '%';
    document.getElementById('pcCurrent').textContent = fmtTime(pcVideo.currentTime);
  }
  function pcUpdateBuffer(){
    if(!pcVideo || !pcVideo.buffered || pcVideo.buffered.length === 0) return;
    if(!isFinite(pcVideo.duration)) return;
    var end = pcVideo.buffered.end(pcVideo.buffered.length - 1);
    var pct = (end / pcVideo.duration) * 100;
    document.getElementById('pcBuffer').style.width = pct + '%';
  }

  var pcProgressBound = false;
  function pcBindProgressEvents(){
    if(pcProgressBound) return;
    pcProgressBound = true;
    var bar = document.getElementById('pcProgress');
    var tooltip = document.getElementById('pcTooltip');
    var scrubbing = false;

    function posToPct(clientX){
      var rect = bar.getBoundingClientRect();
      var x = Math.max(0, Math.min(rect.width, clientX - rect.left));
      return x / rect.width;
    }
    function seek(clientX){
      if(!pcVideo || !pcVideo.duration || pcIsLive) return;
      pcVideo.currentTime = posToPct(clientX) * pcVideo.duration;
    }
    function updateTooltip(clientX){
      if(!pcVideo || !pcVideo.duration || pcIsLive) return;
      var pct = posToPct(clientX);
      tooltip.style.left = (pct * 100) + '%';
      tooltip.textContent = fmtTime(pct * pcVideo.duration);
    }

    bar.addEventListener('mousemove', function(e){ updateTooltip(e.clientX); });
    bar.addEventListener('mouseleave', function(){ tooltip.style.opacity = '0'; });
    bar.addEventListener('mouseenter', function(){
      if(pcVideo && pcVideo.duration && !pcIsLive) tooltip.style.opacity = '';
    });
    bar.addEventListener('mousedown', function(e){
      scrubbing = true; bar.classList.add('scrubbing'); seek(e.clientX); e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if(scrubbing){ seek(e.clientX); updateTooltip(e.clientX); }
    });
    document.addEventListener('mouseup', function(){
      if(scrubbing){ scrubbing = false; bar.classList.remove('scrubbing'); }
    });

    bar.addEventListener('touchstart', function(e){
      if(pcIsLive) return;
      scrubbing = true; bar.classList.add('scrubbing');
      var t = e.touches[0]; seek(t.clientX); updateTooltip(t.clientX);
      e.preventDefault();
    }, {passive:false});
    bar.addEventListener('touchmove', function(e){
      if(!scrubbing) return;
      var t = e.touches[0]; seek(t.clientX); updateTooltip(t.clientX);
      e.preventDefault();
    }, {passive:false});
    bar.addEventListener('touchend', function(){
      scrubbing = false; bar.classList.remove('scrubbing');
    });
  }

  document.addEventListener('keydown', function(e){
    var overlay = document.getElementById('playerOverlay');
    if(!overlay.classList.contains('open')) return;
    if(e.key === 'Escape'){ closePlayer(); return; }
    // ARREGLO: al escribir en el buscador de "A continuación", las
    // letras "k", "m", "f" y la barra espaciadora disparaban pausa,
    // silencio o pantalla completa en vez de escribirse.
    var tg = e.target;
    if(tg && (tg.tagName === 'TEXTAREA' || (tg.tagName === 'INPUT' && tg.type !== 'range') || tg.isContentEditable)) return;
    switch(e.key){
      case ' ':
      case 'k':
        if(pcVideo || radioPlayerInstance){ e.preventDefault(); playerTogglePlay(); }
        break;
      case 'ArrowLeft':
        if(pcVideo && !pcIsLive){ e.preventDefault(); playerSkip(-5); }
        break;
      case 'ArrowRight':
        if(pcVideo && !pcIsLive){ e.preventDefault(); playerSkip(5); }
        break;
      case 'ArrowUp':
        e.preventDefault();
        playerSetVolume(Math.min(1, (pcVideo ? pcVideo.volume : 1) + 0.05));
        break;
      case 'ArrowDown':
        e.preventDefault();
        playerSetVolume(Math.max(0, (pcVideo ? pcVideo.volume : 1) - 0.05));
        break;
      case 'f': playerToggleFullscreen(); break;
      case 'm': playerToggleMute(); break;
    }
  });

  document.getElementById('playerOverlay').addEventListener('click', function(e){
    if(e.target.id === 'playerOverlay') closePlayer();
  });
  document.getElementById('playerOverlay').addEventListener('click', function(e){
    if(e.target.id === 'playerStage' && (pcVideo || radioPlayerInstance)){ playerTogglePlay(); }
  });

  document.addEventListener('click', function(e){
    var menu = document.getElementById('pcSettingsMenu');
    if(menu && menu.classList.contains('open')){
      if(!e.target.closest('.pc-settings-wrap')) menu.classList.remove('open');
    }
  });

  window.addEventListener('scroll', function(){
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 40);
  });

  // ============================================================
  //  PUBLICIDAD (estilo YouTube)
  //  Cada cierto tiempo de reproducción real (fijo o aleatorio, lo
  //  define el admin) se pausa el audio/video con un efecto, entra el
  //  anuncio (video o imagen) y al terminar continúa donde estaba.
  // ============================================================
  var adsCfg_ = { enabled:false, preRoll:false, random:true, intervalMin:10, intervalMax:20, skipAfter:5, imageDuration:8 };
  var adsList_ = [];
  var adState_ = {
    active:false, tick:null, timer:null, introT:null, leaveT:null, gen:0,
    playedSec:0, nextAt:0, sessionStarted:false, lastIdx:-1,
    layer:null, flash:null, startedAt:0, current:null, total:0, wasPlaying:true
  };

  function adsLoad_(){
    if(!hasGasBackend_()) return;
    google.script.run.withSuccessHandler(function(res){
      if(res && res.ok){ adsCfg_ = res.config || adsCfg_; adsList_ = res.ads || []; }
    }).withFailureHandler(function(){}).getAdsPublic(USER_TOKEN || '');
  }
  adsLoad_();

  document.addEventListener('play', function(e){
    if(!adState_.active) return;
    var t = e.target;
    if(t && t.tagName && (t.tagName === 'VIDEO' || t.tagName === 'AUDIO') && t.id !== 'adVideo'){
      try { t.pause(); } catch(x){}
    }
  }, true);

  function adScheduleNext_(){
    var mn = Math.max(0.2, Number(adsCfg_.intervalMin) || 10);
    var mx = Math.max(mn, Number(adsCfg_.intervalMax) || mn);
    var minutes = adsCfg_.random ? (mn + Math.random() * (mx - mn)) : mn;
    adState_.nextAt = adState_.playedSec + Math.round(minutes * 60);
  }

  function adPick_(){
    var n = adsList_.length;
    if(!n) return null;
    var idx;
    if(adsCfg_.random){
      idx = Math.floor(Math.random() * n);
      if(n > 1 && idx === adState_.lastIdx) idx = (idx + 1 + Math.floor(Math.random() * (n - 1))) % n;
    } else {
      idx = (adState_.lastIdx + 1) % n;
    }
    adState_.lastIdx = idx;
    return adsList_[idx];
  }

  function adEnsureDom_(){
    var stage = document.getElementById('playerStage');
    if(!stage) return false;
    if(!adState_.layer || !adState_.layer.parentNode){
      adState_.flash = document.createElement('div');
      adState_.flash.className = 'ad-flash';
      adState_.layer = document.createElement('div');
      adState_.layer.className = 'ad-layer';
      stage.appendChild(adState_.flash);
      stage.appendChild(adState_.layer);
    }
    return true;
  }

  function adOnPlayerOpened_(m){
    if(!adsCfg_.enabled || !adsList_.length) return;
    if(!m || m.tipo === 'image' || m.tipo === 'other') return;
    if(!adState_.tick) adState_.tick = setInterval(adTick_, 250);
    if(adState_.sessionStarted && !adState_.active && adState_.playedSec >= adState_.nextAt){
      var gen2 = adState_.gen;
      setTimeout(function(){ if(gen2 === adState_.gen && pcCurrentMedia && !adState_.active) adStart_(); }, 300);
    }
    if(!adState_.sessionStarted){
      adState_.sessionStarted = true;
      adState_.playedSec = 0;
      adScheduleNext_();
      if(adsCfg_.preRoll){
        var gen = adState_.gen;
        setTimeout(function(){ if(gen === adState_.gen && pcCurrentMedia) adStart_(); }, 300);
      }
    }
  }

  function adTick_(){
    if(!pcCurrentMedia) return;
    if(adState_.active){
      // Mientras dura el anuncio, el contenido no puede seguir sonando.
      if(pcIsPlaying_()) playerPause();
      return;
    }
    if(!pcIsPlaying_()) return;
    adState_.playedSec += 0.25;
    if(adState_.playedSec >= adState_.nextAt){
      // No cortar los últimos segundos de un contenido que está por terminar.
      if(pcVideo && !pcIsLive && pcVideo.duration && (pcVideo.duration - pcVideo.currentTime) < 8) return;
      adStart_();
    }
  }

  function adStart_(){
    if(adState_.active) return;
    var ad = adPick_();
    if(!ad || !adEnsureDom_()) return;
    adState_.active = true;
    adState_.wasPlaying = true;
    adState_.current = ad;
    var gen = adState_.gen;
    var stage = document.getElementById('playerStage');
    playerPause();
    stage.classList.add('ad-incoming');
    adState_.flash.classList.remove('go'); void adState_.flash.offsetWidth; adState_.flash.classList.add('go');
    adState_.introT = setTimeout(function(){
      if(gen !== adState_.gen) return;
      adShow_(ad);
    }, 550);
  }

  function adShow_(ad){
    var layer = adState_.layer;
    var gen = adState_.gen;
    var isVideo = ad.tipo !== 'image';
    var skipAfter = Math.max(0, Number(adsCfg_.skipAfter) || 0);
    var imgDur = Math.max(2, Number(ad.duracion) || Number(adsCfg_.imageDuration) || 8);
    adState_.total = isVideo ? (Number(ad.duracion) || 0) : imgDur;
    adState_.startedAt = Date.now();

    layer.innerHTML =
      '<span class="ad-badge">PUBLICIDAD</span>' +
      '<span class="ad-count" id="adCount"></span>' +
      (isVideo
        ? '<video class="ad-media" id="adVideo" src="'+esc(ad.url)+'" playsinline autoplay></video>'
        : '<div class="ad-bg" style="background-image:url(&quot;'+esc(ad.url)+'&quot;)"></div><img class="ad-media" id="adImg" src="'+esc(ad.url)+'" alt="Publicidad" />') +
      (ad.enlace ? '<button class="ad-link" id="adLink" type="button">Visitar anunciante ↗</button>' : '') +
      (skipAfter > 0 ? '<button class="ad-skip" id="adSkip" type="button" disabled></button>' : '') +
      '<div class="ad-progress"><i id="adBar"></i></div>';
    layer.classList.remove('leaving');
    layer.classList.add('show');

    var v = document.getElementById('adVideo');
    var img = document.getElementById('adImg');
    if(v){
      v.addEventListener('ended', function(){ adEnd_(); });
      v.addEventListener('error', function(){ adEnd_(); });
      var pp = v.play();
      if(pp && pp.catch) pp.catch(function(){
        v.muted = true;
        v.play().catch(function(){});
        if(!document.getElementById('adSound')){
          var sb = document.createElement('button');
          sb.id = 'adSound'; sb.type = 'button'; sb.className = 'ad-sound'; sb.textContent = '🔊 Activar sonido';
          sb.addEventListener('click', function(){ v.muted = false; sb.remove(); });
          layer.appendChild(sb);
        }
      });
    }
    if(img){ img.addEventListener('error', function(){ adEnd_(); }); }
    var link = document.getElementById('adLink');
    if(link) link.addEventListener('click', function(){ try { window.open(ad.enlace, '_blank', 'noopener'); } catch(e){} });
    var skip = document.getElementById('adSkip');
    if(skip) skip.addEventListener('click', function(){ if(!skip.disabled) adEnd_(); });

    if(adState_.timer) clearInterval(adState_.timer);
    adState_.timer = setInterval(function(){
      if(gen !== adState_.gen){ clearInterval(adState_.timer); return; }
      adUpdate_(ad, isVideo, skipAfter);
    }, 250);
    adUpdate_(ad, isVideo, skipAfter);
  }

  function adUpdate_(ad, isVideo, skipAfter){
    var elapsed = (Date.now() - adState_.startedAt) / 1000;
    var v = document.getElementById('adVideo');
    var total = adState_.total;
    if(isVideo && v){
      if(v.readyState < 2 && elapsed > 12){ adEnd_(); return; }       // no carga: seguir con el contenido
      var vd = v.duration && isFinite(v.duration) ? v.duration : 0;
      if(!total || (vd && vd < total)) total = vd;
      elapsed = v.currentTime || 0;
    } else if(elapsed >= total){
      adEnd_(); return;
    }
    if(isVideo && adState_.total && elapsed >= adState_.total){ adEnd_(); return; }
    var remain = Math.max(0, Math.ceil(total - elapsed));
    var cnt = document.getElementById('adCount');
    if(cnt) cnt.textContent = total ? ('Anuncio · ' + remain + 's') : 'Anuncio';
    var bar = document.getElementById('adBar');
    if(bar && total) bar.style.width = Math.min(100, (elapsed / total) * 100) + '%';
    var skip = document.getElementById('adSkip');
    if(skip){
      if(total && total <= skipAfter){ skip.style.display = 'none'; }
      else if(elapsed >= skipAfter){ skip.disabled = false; skip.textContent = 'Saltar anuncio ▶'; }
      else { skip.disabled = true; skip.textContent = 'Podrás saltar en ' + Math.ceil(skipAfter - elapsed) + 's'; }
    }
  }

  function adCleanLayer_(){
    var layer = adState_.layer;
    if(!layer) return;
    var v = layer.querySelector('video');
    if(v){ try { v.pause(); v.removeAttribute('src'); v.load(); } catch(e){} }
    layer.className = 'ad-layer';
    layer.innerHTML = '';
  }

  function adEnd_(){
    if(!adState_.active || adState_.leaveT) return;
    var gen = adState_.gen;
    if(adState_.timer){ clearInterval(adState_.timer); adState_.timer = null; }
    if(adState_.layer) adState_.layer.classList.add('leaving');
    adState_.leaveT = setTimeout(function(){
      adState_.leaveT = null;
      if(gen !== adState_.gen) return;
      adCleanLayer_();
      var stage = document.getElementById('playerStage');
      if(stage) stage.classList.remove('ad-incoming');
      adState_.active = false;
      adState_.current = null;
      adScheduleNext_();
      if(pcCurrentMedia && adState_.wasPlaying) playerPlay();
    }, 400);
  }

  function adReset_(){
    adState_.gen++;
    if(adState_.tick){ clearInterval(adState_.tick); adState_.tick = null; }
    if(adState_.timer){ clearInterval(adState_.timer); adState_.timer = null; }
    if(adState_.introT){ clearTimeout(adState_.introT); adState_.introT = null; }
    if(adState_.leaveT){ clearTimeout(adState_.leaveT); adState_.leaveT = null; }
    adCleanLayer_();
    var stage = document.getElementById('playerStage');
    if(stage) stage.classList.remove('ad-incoming');
    adState_.active = false;
    adState_.sessionStarted = false;
    adState_.playedSec = 0;
    adState_.current = null;
    adsLoad_();   // la próxima vez se usa la configuración/anuncios más recientes
  }

  // ============================================================
  //  NOTIFICACIONES
  // ============================================================
  var NOTIF_READ_KEY = 'streamflix_last_notif_read';
  var allNotifs = [];

  function loadNotificaciones(onDone){
    if(!hasGasBackend_()){
      allNotifs = [];
      renderNotifBadge();
      renderNotifPanel();
      if(onDone) onDone();
      return;
    }
    google.script.run.withSuccessHandler(function(items){
      allNotifs = items || [];
      renderNotifBadge();
      renderNotifPanel();
      if(onDone) onDone();
    }).withFailureHandler(function(){
      document.getElementById('notifPanelList').innerHTML = notifEmptyHtml('No se pudieron cargar las notificaciones.');
      if(onDone) onDone();
    }).getNotificaciones();
  }

  // Botón "Actualizar" de la barra superior: recarga catálogo y
  // notificaciones sin necesidad de recargar toda la página.
  function refreshUsuarioData(){
    var btn = document.getElementById('refreshUsuarioBtn');
    if(btn){ btn.disabled = true; btn.classList.add('spinning'); }
    var pending = 2;
    var finish = function(){
      pending--;
      if(pending <= 0 && btn){
        btn.disabled = false;
        btn.classList.remove('spinning');
      }
    };
    loadAll(finish);
    loadNotificaciones(finish);
  }
  function getLastRead(){ try{ return localStorage.getItem(NOTIF_READ_KEY) || ''; } catch(e){ return ''; } }
  function setLastRead(value){ try{ localStorage.setItem(NOTIF_READ_KEY, value); } catch(e){} }
  function renderNotifBadge(){
    var badge = document.getElementById('notifBadge');
    if(allNotifs.length === 0){ badge.style.display = 'none'; return; }
    var lastRead = getLastRead();
    var unread = allNotifs.filter(function(n){ return !lastRead || new Date(n.fecha) > new Date(lastRead); }).length;
    if(unread > 0){ badge.style.display = 'flex'; badge.textContent = unread > 9 ? '9+' : unread; }
    else { badge.style.display = 'none'; }
  }
  function notifEmptyHtml(msg){
    return '' +
      '<div class="notif-empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">' +
          '<path d="M12 3a6 6 0 0 0-6 6v3.5L4 16h16l-2-3.5V9a6 6 0 0 0-6-6z"/>' +
          '<path d="M9.5 19a2.5 2.5 0 0 0 5 0"/>' +
        '</svg>' +
        esc(msg) +
      '</div>';
  }
  function renderNotifPanel(){
    var list = document.getElementById('notifPanelList');
    if(allNotifs.length === 0){ list.innerHTML = notifEmptyHtml('Sin novedades por ahora.'); return; }
    list.innerHTML = allNotifs.map(function(n){
      var fecha = new Date(n.fecha);
      var fechaStr = isNaN(fecha) ? '' : fecha.toLocaleString();
      return '<div class="notif-item"><div class="notif-dot"></div><div class="notif-body">'+esc(n.mensaje)+'<div class="notif-time">'+fechaStr+'</div></div></div>';
    }).join('');
  }
  function toggleNotifPanel(){
    var panel = document.getElementById('notifPanel');
    var opening = !panel.classList.contains('open');
    panel.classList.toggle('open', opening);
    if(opening && allNotifs.length > 0){
      setLastRead(allNotifs[0].fecha);
      renderNotifBadge();
    }
  }
  document.addEventListener('click', function(e){
    var wrap = document.querySelector('.notif-wrap');
    if(wrap && !wrap.contains(e.target)) document.getElementById('notifPanel').classList.remove('open');
  });

  bootUsuario();
</script>
