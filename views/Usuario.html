<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.jsdelivr.net/npm/icecast-metadata-player@1.17.13/build/icecast-metadata-player-1.17.13.main.min.js"></script>
<style>
  :root{
    --bg:#141414; --panel:#181818; --card:#181818; --red:#e50914; --red-hover:#f40612;
    --spotify:#1db954; --spotify-hover:#1ed760;
    --muted:#808080; --border:#2a2a2a; --text:#fff;
    --safe-x: clamp(16px, 4vw, 64px);
    --card-w: clamp(148px, 15.5vw, 250px);
    --card-ratio: 16/9;
    --nav-h: 68px;
    --row-pb: 30px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif; overflow-x:hidden; }
  a{ color:inherit; }
  img{ max-width:100%; }

  a:focus-visible, button:focus-visible, .card:focus-visible, input:focus-visible{
    outline:3px solid #fff; outline-offset:3px; box-shadow:0 0 0 3px var(--red);
  }

  /* ============================================================
     NAV — barra superior profesional (glass). Logo a la izquierda,
     buscador centrado, acciones a la derecha. En móvil el buscador
     se colapsa a un ícono y se abre como overlay.
     ============================================================ */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    height:var(--nav-h);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:0 var(--safe-x);
    background:linear-gradient(180deg, rgba(10,10,12,.92) 0%, rgba(10,10,12,.55) 55%, rgba(10,10,12,0) 100%);
    border-bottom:none;
    transition:background .3s ease, box-shadow .3s ease;
  }
  .nav.scrolled{
    background:rgba(12,12,15,.78);
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:none;
  }
  .nav::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; pointer-events:none;
    background:none; display:none;
    opacity:0; transition:opacity .3s ease;
  }
  .nav.scrolled::after{ opacity:0; }

  /* --- Marca --- */
  .nav-logo{ display:flex; align-items:center; gap:12px; min-width:0; flex:0 1 auto; cursor:default; }
  .nav-logo-mark{
    width:38px; height:38px; border-radius:10px; flex:0 0 auto; overflow:hidden;
    background:linear-gradient(135deg, var(--red), var(--red-hover));
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800; color:#fff;
    box-shadow:0 4px 16px rgba(229,9,20,.35), inset 0 0 0 1px rgba(255,255,255,.12);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .nav-logo:hover .nav-logo-mark{ transform:translateY(-1px) scale(1.04); box-shadow:0 8px 22px rgba(229,9,20,.5), inset 0 0 0 1px rgba(255,255,255,.18); }
  .nav-logo-mark img{ display:block; width:100%; height:100%; object-fit:cover; border-radius:10px; }
  .nav-logo-text{ min-width:0; line-height:1.1; }
  .nav-logo-name{ font-weight:800; font-size:clamp(15px,1.6vw,18px); color:#fff; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav-logo-sub{ font-size:10px; color:#9a9aa2; text-transform:uppercase; letter-spacing:1.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

  /* --- Contenedor derecho: buscador + acciones --- */
  .nav-right{
    display:flex; align-items:center; gap:10px;
    flex:1 1 auto; min-width:0;
    justify-content:flex-end;
  }

  /* --- Buscador de escritorio --- */
  .nav-search{
    display:flex; align-items:center; gap:10px;
    height:40px; padding:0 8px 0 14px; border-radius:999px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    flex:1 1 280px; max-width:400px; min-width:160px; margin:0 auto;
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease, max-width .25s ease;
  }
  .nav-search:hover{ background:rgba(255,255,255,.1); }
  .nav-search:focus-within{
    background:rgba(255,255,255,.12); border-color:rgba(229,9,20,.75);
    box-shadow:0 0 0 3px rgba(229,9,20,.18); max-width:460px;
  }
  .nav-ico{ width:18px; height:18px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .nav-search .nav-ico{ color:#9a9aa2; width:17px; height:17px; transition:color .2s; }
  .nav-search:focus-within .nav-ico{ color:#fff; }
  .nav-search input{ background:transparent; border:none; outline:none; box-shadow:none; color:#fff; font-size:14px; width:100%; min-width:0; }
  .nav-search input::placeholder, .nav-search-full input::placeholder{ color:#8c8c93; }
  .nav-search-kbd{
    flex:0 0 auto; font-size:11px; font-weight:600; line-height:1; color:#9a9aa2;
    border:1px solid rgba(255,255,255,.16); border-radius:6px; padding:4px 7px;
  }
  .nav-search:focus-within .nav-search-kbd, .nav-search.has-value .nav-search-kbd{ display:none; }
  .nav-search-clear{
    display:none; flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; align-items:center; justify-content:center; transition:background .15s;
  }
  .nav-search-clear .nav-ico{ width:13px; height:13px; }
  .nav-search-clear:hover{ background:rgba(229,9,20,.85); }
  .nav-search.has-value .nav-search-clear{ display:inline-flex; }

  /* --- Botón circular genérico (actualizar, buscar móvil, volver, limpiar) --- */
  .nav-icon-btn{
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); color:#fff;
    width:40px; height:40px; border-radius:50%; cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s, transform .15s; flex:0 0 auto;
  }
  .nav-icon-btn:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.2); transform:translateY(-1px); }
  .nav-icon-btn:disabled{ cursor:progress; opacity:.8; transform:none; }
  .nav-icon-btn.spinning{ animation:none; }
  .nav-icon-btn.spinning .nav-ico{ animation:spin360 .8s linear infinite; }
  @keyframes spin360{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  /* Ícono de búsqueda para móvil — oculto en escritorio */
  .search-toggle-btn{ display:none; }

  /* Overlay de búsqueda dentro del nav (solo móvil) */
  .nav-search-overlay{
    display:none; align-items:center; gap:10px; width:100%;
    animation:searchIn .2s ease;
  }
  .nav-search-overlay.open{ display:flex; }
  .nav.search-mode .nav-logo,
  .nav.search-mode .nav-right{ display:none; }

  .nav-search-full{
    flex:1; min-width:0; height:40px;
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.09); border:1px solid rgba(229,9,20,.6); border-radius:999px; padding:0 14px;
    box-shadow:0 0 0 3px rgba(229,9,20,.15);
  }
  .nav-search-full .nav-ico{ color:#9a9aa2; width:17px; height:17px; }
  .nav-search-full input{ background:transparent; border:none; outline:none; color:#fff; font-size:15px; width:100%; min-width:0; }

  @keyframes searchIn{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* --- Usuario --- */
  .nav-user{
    display:flex; align-items:center; gap:10px;
    height:40px; padding:0 4px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:999px;
    flex:0 0 auto;
  }
  .nav-user-avatar{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(135deg, #8a0410, #e50914);
    box-shadow:0 0 0 2px rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; color:#fff;
  }
  .nav-user-name{
    font-size:13px; font-weight:600; color:#fff;
    max-width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .nav-user-logout{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:30px; padding:0 12px; border-radius:999px; cursor:pointer; flex:0 0 auto;
    background:rgba(229,9,20,.12); border:1px solid rgba(229,9,20,.32); color:#ff8f95;
    font-size:12px; font-weight:600; transition:background .15s, color .15s, border-color .15s;
  }
  .nav-user-logout .nav-ico{ width:14px; height:14px; }
  .nav-user-logout:hover{ background:var(--red); border-color:var(--red); color:#fff; }

  /* --- Notificaciones --- */
  .notif-wrap{ position:relative; flex:0 0 auto; }
  .notif-bell{
    position:relative; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); color:#fff;
    width:40px; height:40px; border-radius:50%; cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s, transform .15s;
  }
  .notif-bell:hover{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.2); transform:translateY(-1px); }
  .notif-badge{
    position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
    min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;
    box-shadow:0 0 0 2px #0e0e11;
  }
  .notif-panel{
    display:none; position:absolute; top:calc(100% + 12px); right:0; width:min(340px, 90vw); max-height:60vh; overflow-y:auto;
    background:rgba(24,24,27,.96); border:1px solid rgba(255,255,255,.09); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.65); z-index:150;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .notif-panel.open{ display:block; animation:searchIn .18s ease; }
  .notif-panel-title{ font-weight:700; font-size:14px; padding:14px 16px 10px; }
  .notif-item{ padding:12px 16px; border-top:1px solid rgba(255,255,255,.06); font-size:13px; line-height:1.4; display:flex; gap:10px; transition:background .15s; }
  .notif-item:hover{ background:rgba(255,255,255,.04); }
  .notif-item .notif-dot{
    flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--red);
    margin-top:5px; box-shadow:0 0 8px rgba(229,9,20,.6);
  }
  .notif-item .notif-body{ min-width:0; }
  .notif-item .notif-time{ font-size:11px; color:var(--muted); margin-top:4px; }
  .notif-empty{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 16px; color:var(--muted); font-size:13px; }
  .notif-empty svg{ width:30px; height:30px; margin-bottom:10px; color:#45454c; }

  @media (max-width:640px){
    :root{ --nav-h:60px; }
    .nav-user-logout span{ display:none; }
    .nav-user-logout{ width:30px; padding:0; }
  }
  @media (max-width:420px){
    .nav-user-name{ display:none; }
    .nav-user{ padding:0 4px 0 4px; gap:6px; }
    #refreshUsuarioBtn{ display:none; }
  }

  /* ============================================================
     HERO CARRUSEL
     Ajuste de imagen inteligente: si la proporción de la imagen se
     parece a la del carrusel se llena con "cover" (sin barras); si es
     muy distinta (póster vertical, 4:3, ultra panorámica) se muestra
     COMPLETA con "contain" sobre un fondo desenfocado de sí misma,
     así nunca se corta ni se deforma. (JS: heroFitSlide_)
     ============================================================ */
  .hero-carousel{
    position:relative; width:100%;
    height:clamp(420px, 48vw, 660px);
    overflow:hidden;
    background:#000;
  }
  .hero-slide{
    position:absolute; inset:0;
    display:flex; align-items:flex-end;
    padding-top:var(--nav-h);
    opacity:0; transform:translateX(5%);
    transition:opacity .7s ease, transform .7s ease;
    pointer-events:none;
    overflow:hidden;
    background:radial-gradient(ellipse at 70% 20%, rgba(229,9,20,.22) 0%, transparent 55%), #0b0b0d;
  }
  .hero-slide.active{
    opacity:1; transform:translateX(0);
    pointer-events:auto;
    z-index:2;
  }
  .hero-slide.prev{ transform:translateX(-5%); }

  /* Fondo desenfocado (solo visible en modo contain) */
  .hero-slide .hero-backdrop{
    position:absolute; top:-6%; left:-6%; width:112%; height:112%;
    object-fit:cover; z-index:0; pointer-events:none;
    filter:blur(30px) brightness(.5) saturate(1.2);
    opacity:0; transition:opacity .4s ease;
  }
  .hero-slide.fit-contain .hero-backdrop{ opacity:1; }

  /* Imagen principal: <img> real (no background-image) para que el zoom
     sea estable en móvil y no parta la imagen */
  .hero-slide .hero-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 28%;
    z-index:0;
    will-change:transform;
    transform:scale(1.02);
    transform-origin:center center;
    pointer-events:none;
  }
  .hero-slide.active .hero-bg{ animation:heroZoomImg 9s ease-out forwards; }
  @keyframes heroZoomImg{
    from{ transform:scale(1.02); }
    to  { transform:scale(1.05); }
  }

  /* Modo contain: imagen completa, sin zoom, debajo de la barra superior.
     En escritorio se alinea a la derecha (el texto queda a la izquierda)
     con un degradado suave en su borde izquierdo. */
  .hero-slide.fit-contain .hero-bg{
    top:var(--nav-h); height:calc(100% - var(--nav-h));
    object-fit:contain; object-position:right center;
    transform:none; animation:none !important;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 14%);
            mask-image:linear-gradient(90deg, transparent 0, #000 14%);
  }
  @media (max-width:768px){
    .hero-slide .hero-bg{ object-position:center center; }
    .hero-slide.fit-contain .hero-bg{
      object-position:center top;
      -webkit-mask-image:none; mask-image:none;
    }
  }
  @media (max-width:640px){
    .hero-carousel{ height:clamp(420px, 108vw, 540px); }
  }
  .hero-slide.low-res .hero-bg{ animation:none !important; transform:none; }

  /* Slides de audio: acento verde, e ícono de respaldo cuando no hay imagen */
  .hero-slide.is-audio-slide{ background:radial-gradient(ellipse at 72% 30%, rgba(29,185,84,.28) 0%, transparent 58%), #0b0b0d; }
  .hero-slide.is-audio-slide .hero-tag{ background:rgba(29,185,84,.95); box-shadow:0 4px 14px rgba(29,185,84,.4); }
  .hero-fallback{
    display:none; position:absolute; z-index:0; pointer-events:none;
    top:var(--nav-h); bottom:0; right:clamp(24px,10vw,160px); width:34%;
    align-items:center; justify-content:center;
    font-size:clamp(90px,16vw,230px); line-height:1;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.6)); opacity:.92;
  }
  .hero-slide.no-img .hero-fallback{ display:flex; }
  @media (max-width:768px){
    .hero-fallback{ right:0; left:0; width:auto; bottom:auto; top:calc(var(--nav-h) + 8px); height:42%; font-size:clamp(72px,26vw,130px); }
  }
  @media (prefers-reduced-motion:reduce){
    .hero-slide.active .hero-bg{ animation:none; }
  }

  .hero-slide::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,15,18,.15) 0%, rgba(15,15,18,.5) 60%, var(--bg) 100%),
               linear-gradient(90deg, rgba(15,15,18,.88) 0%, rgba(15,15,18,.15) 55%);
    z-index:1;
    pointer-events:none;
  }
  .hero-content{ position:relative; z-index:2; padding:0 var(--safe-x) clamp(52px,7vw,84px); max-width:min(660px, 92vw); }
  .hero-tag{
    display:inline-flex; align-items:center; gap:8px;
    color:#fff; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:1.4px; margin-bottom:12px;
    padding:5px 11px; border-radius:999px;
    background:rgba(229,9,20,.9); box-shadow:0 4px 14px rgba(229,9,20,.4);
  }
  .hero-title{
    font-size:clamp(26px, 4.6vw, 52px); font-weight:800; margin:0 0 22px; line-height:1.12; letter-spacing:-.4px;
    text-shadow:0 2px 14px rgba(0,0,0,.65);
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .hero-desc{
    color:#e8e8ea; font-size:clamp(13px,1.5vw,15px); line-height:1.55; margin:0 0 22px; max-width:56ch;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  .hero-desc a{ color:#ff8a8a; text-decoration:underline; }
  .desc-img{ display:block; max-width:100%; height:auto; border-radius:8px; margin:8px 0; cursor:zoom-in; }
  .hero-desc .desc-img{ max-height:60px; object-fit:contain; }
  .hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:8px; padding:12px 26px; font-size:15px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .15s ease, background .15s ease, box-shadow .15s ease; }
  .btn-play{ background:#fff; color:#000; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .btn-play:hover, .btn-play:focus-visible{ background:#ececec; transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.45); }
  .btn-info{ background:rgba(109,109,110,.6); color:#fff; }
  .btn-info:hover{ background:rgba(109,109,110,.85); transform:translateY(-1px); }

  .hero-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:48px; height:48px; border-radius:50%; padding:0;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.18);
    color:#fff; cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s, transform .15s, box-shadow .15s, opacity .2s;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .hero-arrow .nav-ico{ width:22px; height:22px; stroke-width:2.4; }
  .hero-arrow:hover{ background:rgba(229,9,20,.9); border-color:var(--red); transform:translateY(-50%) scale(1.1); box-shadow:0 0 22px rgba(229,9,20,.6); }
  .hero-arrow.left{ left:clamp(10px,2vw,24px); }
  .hero-arrow.right{ right:clamp(10px,2vw,24px); }
  @media (max-width:640px){ .hero-arrow{ width:38px; height:38px; } .hero-arrow .nav-ico{ width:18px; height:18px; } }

  /* En móvil: espacio extra para que "Reproducir" y los puntos no se toquen */
  @media (max-width:640px){
    .hero-content{ padding-bottom:58px; }
    .hero-dots{ bottom:14px; }
  }

  .hero-dots{
    position:absolute; bottom:clamp(20px,3.4vw,34px); left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:5;
  }
  .hero-dot{
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,.35); cursor:pointer; transition:.2s;
    border:none; padding:0;
  }
  .hero-dot.active{ background:var(--red); width:26px; border-radius:5px; box-shadow:0 0 14px rgba(229,9,20,.9), 0 0 4px rgba(229,9,20,1); }
  .hero-dot:hover{ background:rgba(255,255,255,.7); }
  .hero-dot.active:hover{ background:var(--red); }

  .hero-progress{
    position:absolute; bottom:0; left:0; height:3px; width:100%;
    background:rgba(255,255,255,.06); z-index:5; overflow:hidden;
  }
  .hero-progress-bar{
    height:100%; width:0;
    background:linear-gradient(90deg, rgba(178,7,15,.9), rgba(229,9,20,.95));
    transition:width .1s linear;
  }

  .rows{
    padding: clamp(14px, 1.8vw, 24px) 0 60px;
    margin-top:0;
    position:relative;
    z-index:3;
  }
  .row-block{ margin-bottom:clamp(6px,1vw,12px); position:relative; }
  .row-title{
    font-size:clamp(15px,1.8vw,20px); font-weight:700; letter-spacing:-.2px; margin:0 0 4px; padding:0 var(--safe-x);
    position:relative; display:inline-flex; align-items:center; gap:10px;
  }
  .row-title::before{
    content:''; width:4px; height:1em; border-radius:3px;
    background:linear-gradient(180deg, var(--red), #8a0410);
    box-shadow:0 0 10px rgba(229,9,20,.7);
    flex:0 0 auto;
  }
  .row-track-wrap{ position:relative; }

  .row-track{
    display:flex; gap:clamp(8px,1vw,14px);
    overflow-x:auto;
    padding: 14px var(--safe-x) var(--row-pb);
    scroll-padding-left:var(--safe-x);
    scroll-behavior:smooth;
    scroll-snap-type:x proximity;
    scrollbar-width:none;
    -ms-overflow-style:none;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    -webkit-overflow-scrolling:touch;
  }
  .row-track::-webkit-scrollbar{ display:none; }
  .row-track.dragging{
    cursor:grabbing;
    scroll-behavior:auto;
    scroll-snap-type:none;
  }

  .row-arrow{
    display:none; position:absolute; top:0; bottom:var(--row-pb); width:56px; z-index:6;
    align-items:center; justify-content:center; border:none; cursor:pointer;
    background:linear-gradient(90deg, rgba(15,15,18,.95), transparent); color:#fff; font-size:30px;
    transition:opacity .2s, color .15s;
  }
  .row-arrow.right{ right:0; left:auto; background:linear-gradient(270deg, rgba(15,15,18,.95), transparent); }
  .row-arrow.left{ left:0; }
  @media (hover:hover) and (pointer:fine){
    .row-track-wrap:hover .row-arrow{ display:flex; }
  }
  .row-arrow:focus-visible{ display:flex; }
  .row-arrow:hover{ color:var(--red); }

  .row-track-wrap::before,
  .row-track-wrap::after{
    content:'';
    position:absolute; top:0; bottom:var(--row-pb); width:60px;
    pointer-events:none; z-index:5;
    transition:opacity .25s;
    opacity:0;
  }
  .row-track-wrap::before{
    left:0;
    background:linear-gradient(90deg, var(--bg) 0%, transparent 100%);
  }
  .row-track-wrap::after{
    right:0;
    background:linear-gradient(270deg, var(--bg) 0%, transparent 100%);
  }
  .row-track-wrap.scroll-left::before{ opacity:1; }
  .row-track-wrap.scroll-right::after{ opacity:1; }

  /* ---------- CARD ----------
     Todas las cards comparten la misma proporción (16:9). La imagen
     llena la card con "cover" cuando su proporción es parecida; si es
     muy distinta (póster vertical, cuadrada, 4:3...) se muestra completa
     con "contain" sobre un fondo desenfocado de la misma imagen
     (.fit-contain, la activa JS: applyCardFit_). */
  .card{
    flex:0 0 auto; width:var(--card-w); aspect-ratio:var(--card-ratio);
    border-radius:10px; overflow:hidden; position:relative;
    cursor:pointer; background:#141416;
    transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s ease, border-color .3s ease;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    scroll-snap-align:start;
    pointer-events:auto;
    isolation:isolate;
    transform:translateZ(0);
  }
  .card::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%);
    background-size:200% 100%; background-position:150% 0;
    z-index:2; pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){ .card::before{ display:none; } }
  .card:hover, .card:focus-visible{
    transform:scale(1.07);
    box-shadow:0 18px 44px rgba(0,0,0,.8), 0 0 0 2px rgba(229,9,20,.6), 0 0 26px rgba(229,9,20,.3);
    z-index:5;
    border-color:#e50914;
  }
  @media (hover:hover) and (pointer:fine){
    .card:hover::before{ transition:background-position .8s ease; background-position:-50% 0; }
  }
  .card img, .card video{ width:100%; height:100%; object-fit:cover; object-position:center 30%; display:block; pointer-events:none; }
  .card img{
    position:absolute; inset:0; z-index:1;
    opacity:0; transition:opacity .4s ease;
    background:linear-gradient(100deg, #1f1f1f 8%, #222227 18%, #1f1f1f 33%);
    background-size:200% 100%;
    animation:cardShimmer 1.4s ease-in-out infinite;
  }
  .card img.loaded{ opacity:1; animation:none; background:none; }
  /* Modo contain: imagen completa + fondo desenfocado de la misma imagen */
  .card.fit-contain img{ object-fit:contain; }
  .card.fit-contain::after{
    content:''; position:absolute; inset:-12%; z-index:0; pointer-events:none;
    background:var(--card-bg) center/cover no-repeat;
    filter:blur(16px) brightness(.55) saturate(1.2);
  }
  @keyframes cardShimmer{
    0%{ background-position:150% 0; }
    100%{ background-position:-50% 0; }
  }
  .card .placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:34px; background:linear-gradient(135deg,#222,#000);
  }
  .card-preview-video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .35s ease; z-index:3; background:#000;
  }
  .card-preview-video.show{ opacity:1; }
  .card-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.7);
    width:44px; height:44px; border-radius:50%;
    background:rgba(0,0,0,.55); border:1.5px solid rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .2s ease, transform .2s ease;
    z-index:5; pointer-events:none; backdrop-filter:blur(2px);
  }
  .card-play svg{ width:16px; height:16px; fill:#fff; margin-left:2px; }
  @media (hover:hover) and (pointer:fine){
    .card:hover .card-play{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  .card-badge{
    position:absolute; top:8px; left:8px; z-index:5;
    background:rgba(229,9,20,.92); color:#fff; font-size:10px; font-weight:800;
    padding:3px 8px; border-radius:999px; letter-spacing:.4px;
    display:flex; align-items:center; gap:3px;
    box-shadow:0 3px 10px rgba(229,9,20,.4);
    animation:badgePulse 2.4s ease-in-out infinite;
  }
  @keyframes badgePulse{
    0%, 100%{ box-shadow:0 3px 10px rgba(229,9,20,.4); }
    50%{ box-shadow:0 3px 16px rgba(229,9,20,.85); }
  }
  @media (prefers-reduced-motion:reduce){ .card-badge{ animation:none; } }
  .card-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:22px 11px 9px;
    background:linear-gradient(0deg, rgba(0,0,0,.92), rgba(0,0,0,.45) 60%, transparent);
    font-size:clamp(11.5px,1.2vw,13px); font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; z-index:4;
  }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:100px 20px; color:var(--muted);
  }
  .empty-state-icon{
    width:64px; height:64px; margin-bottom:18px; color:#4a4a52;
    opacity:.9;
  }
  .empty-state-title{ font-size:17px; font-weight:700; color:#e2e2e5; margin-bottom:6px; }
  .empty-state-sub{ font-size:13.5px; color:var(--muted); max-width:340px; line-height:1.5; }

  /* ============================================================
     REPRODUCTOR
     ============================================================ */
  .player-overlay{
    display:none; position:fixed; inset:0; z-index:1000;
    background:radial-gradient(ellipse at center, rgba(10,10,12,.96) 0%, rgba(0,0,0,.99) 100%);
    align-items:center; justify-content:center;
    padding:clamp(8px,2vw,32px);
    overflow-y:auto;
    backdrop-filter:blur(6px);
  }
  .player-overlay.open{ display:flex; animation:playerFade .28s ease; }
  @keyframes playerFade{ from{opacity:0} to{opacity:1} }
  .player-overlay.open .player-box{ animation:playerBoxIn .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes playerBoxIn{ from{ opacity:0; transform:scale(.97) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  @media (prefers-reduced-motion:reduce){
    .player-overlay.open, .player-overlay.open .player-box{ animation:none; }
  }

  .player-box{
    width:100%; max-width:1180px; margin:auto;
    background:#141414;
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.03) inset;
    overflow:hidden;
    display:flex; flex-direction:column;
    max-height:88vh;
  }

  .player-header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px;
    background:linear-gradient(180deg, #1f1f1f, #181818);
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }

  .player-logo{
    display:flex; align-items:center; gap:8px;
    font-weight:900; font-size:14px; color:var(--red); letter-spacing:.6px;
    padding:6px 10px; background:rgba(229,9,20,.08); border:1px solid rgba(229,9,20,.25); border-radius:6px;
    white-space:nowrap;
  }
  .player-logo img{
    display:block; height:18px; max-width:120px; width:auto; object-fit:contain;
  }
  .player-header-title{
    font-size:15px; font-weight:700; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-header-meta{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
  .player-header-actions{ display:flex; align-items:center; gap:8px; }
  .player-hdr-btn{
    background:#1e1e23; border:1px solid #2a2a2a; color:#d0d0d5;
    width:38px; height:38px; border-radius:8px; cursor:pointer; font-size:16px;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s;
  }
  .player-hdr-btn:hover{ background:#2a2a31; color:#fff; border-color:#404040; }
  .player-close{
    background:#2a1414; border:1px solid #4a1e1e; color:#ff8080;
    width:38px; height:38px; border-radius:8px; cursor:pointer; font-size:20px;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s;
  }
  .player-close:hover{ background:#4a1e1e; color:#fff; }

  .player-stage{
    position:relative; background:#000; width:100%;
    aspect-ratio:16/9; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .player-stage.is-image,
  .player-stage.is-other{ aspect-ratio:auto; min-height:420px; max-height:70vh; }
  .player-stage video,
  .player-stage img{
    width:100%; height:100%; display:block;
    background:#000;
  }
  .player-stage video{ object-fit:cover; }
  /* Las imágenes se ven completas (sin recortar), sea cual sea su
     tamaño o proporción original: se centran y se ajustan dentro
     del recuadro, con barras negras si hace falta, en vez de
     recortarse como si fuera una miniatura. El tope de 70vh es solo
     para imágenes: el video siempre llena el 100% del escenario
     (arriba) para que no queden franjas negras. */
  .player-stage img{ object-fit:contain; max-height:70vh; }
  .player-stage.is-other .player-fallback{
    padding:60px 30px; text-align:center; color:var(--muted); font-size:15px;
  }
  .player-stage.is-other .player-fallback a{
    color:var(--red); font-weight:700; font-size:16px;
    display:inline-flex; align-items:center; gap:8px; margin-top:14px;
  }

  /* Aviso de error dentro del reproductor: reemplaza el antiguo enlace
     directo a la URL cruda (que en varios navegadores/apps terminaba
     saltando fuera del sistema). Ahora es solo un mensaje + botón para
     reintentar, sin exponer ni abrir la URL original. */
  .player-media-error{
    padding:50px 24px; text-align:center; color:#ffb0b0; font-size:14px; line-height:1.6;
  }
  .player-media-error .pme-icon{ font-size:38px; margin-bottom:12px; display:block; }
  .player-media-error .pme-sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  .player-media-error button{
    margin-top:16px; background:var(--red); color:#fff; border:none; border-radius:8px;
    padding:10px 22px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .player-media-error button:hover{ background:#f40612; }

  .live-indicator{
    display:none; position:absolute; top:14px; left:14px; z-index:4;
    background:rgba(229,9,20,.9); color:#fff; font-size:11px; font-weight:800;
    padding:5px 11px; border-radius:20px; letter-spacing:.8px;
    align-items:center; gap:6px;
    box-shadow:0 4px 14px rgba(229,9,20,.5);
  }
  .live-indicator.show{ display:inline-flex; }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:#fff;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.35; transform:scale(.8); }
  }

  /* ============================================================
     WATERMARK DEL REPRODUCTOR (logo superpuesto sobre el video)
     Tamano estandar fijo (44px) en TODAS las pantallas: redondo,
     con sombra suave de baja opacidad.
     ============================================================ */
  .player-watermark{
    position:absolute; top:12px; right:12px; z-index:4;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
    border:2px solid #fff; box-sizing:border-box;
    box-shadow:0 2px 10px rgba(255,255,255,.35);
    overflow:hidden;
    pointer-events:none;
  }
  .player-watermark img{
    display:block;
    width:100%; height:100%;
    padding:6px; box-sizing:border-box;
    border-radius:50%;
    object-fit:contain;
  }
  .player-watermark span{
    color:#fff; font-size:12px; font-weight:800; letter-spacing:.5px; white-space:nowrap;
  }

  .player-controls{
    position:absolute; left:0; right:0; bottom:0;
    padding:40px 18px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 55%, transparent 100%);
    opacity:0; transition:opacity .25s ease;
    pointer-events:none;
    z-index:10;
  }
  .player-stage.controls-visible .player-controls{ opacity:1; pointer-events:auto; }
  .player-stage:not(:fullscreen) .player-controls:focus-within{ opacity:1; pointer-events:auto; }

  @media (hover:hover) and (pointer:fine){
    .player-stage:not(:fullscreen):hover .player-controls{
      opacity:1; pointer-events:auto;
    }
  }

  /* En touch no hay :hover, así que el thumb de la barra de progreso
     (y la barra misma, más alta para acertar el toque) quedan siempre
     visibles en vez de aparecer solo al pasar el mouse. */
  @media (hover:none) and (pointer:coarse){
    .pc-progress{ height:7px; }
    .pc-progress-thumb{ opacity:1; }
  }

  .player-stage:fullscreen:not(.controls-visible){ cursor:none; }

  .player-stage.is-live .pc-progress{ display:none; }
  .player-stage.is-live .pc-time{ display:none; }
  /* En vivo (radio/canal en vivo) no hay adelantar/retroceder posible */
  .player-stage.is-live .pc-skip-btn{ display:none; }

  .pc-progress{
    position:relative; height:5px; background:rgba(255,255,255,.18);
    border-radius:3px; cursor:pointer; margin-bottom:12px;
    transition:height .15s;
  }
  .pc-progress:hover{ height:8px; }
  .pc-progress-buffer{
    position:absolute; inset:0 auto 0 0; height:100%;
    background:rgba(255,255,255,.28); border-radius:3px;
    width:0; transition:width .2s;
  }
  .pc-progress-fill{
    position:absolute; inset:0 auto 0 0; height:100%;
    background:linear-gradient(90deg, #b2070f, var(--red));
    border-radius:3px; width:0;
  }
  .pc-progress-thumb{
    position:absolute; top:50%; left:0; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%; background:#fff;
    box-shadow:0 0 0 3px rgba(229,9,20,.55);
    opacity:0; transition:opacity .15s;
  }
  .pc-progress:hover .pc-progress-thumb,
  .pc-progress.scrubbing .pc-progress-thumb{ opacity:1; }
  .pc-tooltip{
    position:absolute; bottom:22px; transform:translateX(-50%);
    background:#111; color:#fff; font-size:11px; padding:4px 8px; border-radius:4px;
    border:1px solid #2a2a2a; pointer-events:none; opacity:0; transition:opacity .15s;
    white-space:nowrap;
  }
  .pc-progress:hover .pc-tooltip{ opacity:1; }

  .pc-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .pc-bar-left, .pc-bar-right{ display:flex; align-items:center; gap:6px; }
  .pc-btn{
    background:transparent; border:none; color:#fff; cursor:pointer;
    width:38px; height:38px; border-radius:6px; font-size:17px;
    display:inline-flex; align-items:center; justify-content:center; transition:.15s;
  }
  .pc-btn:hover{ background:rgba(255,255,255,.12); }
  .pc-btn svg{ width:20px; height:20px; fill:currentColor; }
  .pc-btn.play-btn{ width:46px; height:46px; }
  .pc-btn.play-btn svg{ width:24px; height:24px; }
  .pc-time{
    color:#e8e8ea; font-size:12px; font-variant-numeric:tabular-nums;
    padding:0 10px; letter-spacing:.3px; white-space:nowrap;
  }
  .pc-time .pc-sep{ color:#666; margin:0 4px; }

  .pc-volume{ display:flex; align-items:center; gap:6px; }
  .pc-volume-slider{
    width:0; overflow:hidden; transition:width .2s ease;
    display:flex; align-items:center;
  }
  .pc-volume:hover .pc-volume-slider,
  .pc-volume:focus-within .pc-volume-slider{ width:88px; }
  .pc-volume-slider input[type=range]{
    width:80px; accent-color:var(--red); cursor:pointer;
  }

  .pc-settings-wrap{ position:relative; }
  .pc-settings-menu{
    /* position:fixed (en vez de absolute) para que el menú nunca quede
       recortado por el overflow-x:auto de .pc-bar-right en móvil, que
       era la causa de que el botón de velocidad "no funcionara" (el
       menú se abría pero quedaba invisible/cortado). La posición real
       (top/left) se calcula en JS con positionSettingsMenu(). */
    display:none; position:fixed; top:0; left:0;
    background:#181818; border:1px solid #2a2a2a; border-radius:8px;
    min-width:170px; padding:8px; box-shadow:0 14px 40px rgba(0,0,0,.7);
    z-index:10000;
  }
  .pc-settings-menu.open{ display:block; }
  .pc-settings-label{
    font-size:10px; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted); padding:6px 10px 4px;
  }
  .pc-settings-item{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; background:transparent; border:none; color:#e8e8ea;
    font-size:13px; padding:9px 10px; border-radius:5px; cursor:pointer;
    text-align:left;
  }
  .pc-settings-item:hover{ background:#232329; }
  .pc-settings-item.active{ color:var(--red); font-weight:700; }
  .pc-settings-item .pc-check{ font-size:12px; }
  .pc-settings-quality:not(:empty){
    margin-bottom:6px; padding-bottom:8px; border-bottom:1px solid #262629;
  }

  .player-spinner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:48px; height:48px; border-radius:50%;
    border:3px solid rgba(255,255,255,.12); border-top-color:var(--red); border-right-color:rgba(229,9,20,.4);
    animation:spin .9s cubic-bezier(.5,.1,.5,.9) infinite; display:none; z-index:5;
    box-shadow:0 0 20px rgba(229,9,20,.15);

  .player-spinner.show{ display:block; }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  .player-big-play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:86px; height:86px; border-radius:50%;
    background:rgba(229,9,20,.9); border:none; color:#fff; cursor:pointer;

  .player-big-play.show{ display:flex; }
  .player-big-play svg{ width:34px; height:34px; fill:#fff; margin-left:4px; }

  .player-info{
    padding:22px 24px 24px;
    background:#141414;
    border-top:1px solid #1f1f1f;
  }
  .player-info-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
  .player-title{
    font-size:clamp(18px,2.4vw,22px); font-weight:800; margin:0; line-height:1.25;
    flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .player-tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .player-tag{
    display:inline-flex; align-items:center; gap:6px;
    background:#1f1f1f; color:#cfcfd4; font-size:11px; font-weight:600;
    padding:5px 11px; border-radius:20px; border:1px solid #2a2a2a;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .player-tag.is-primary{ background:rgba(229,9,20,.12); color:#ff8a8a; border-color:rgba(229,9,20,.35); }
  .player-desc{ color:#c8c8cd; font-size:14px; line-height:1.6; margin:0; word-break:break-word; overflow-wrap:anywhere; hyphens:auto; text-align:justify; text-align-last:left; }
  .player-desc a{ color:#ff8a8a; text-decoration:underline; word-break:break-all; }

  /* ============================================================
     DESCRIPCIÓN + IMAGEN: la imagen queda flotando (float) a un
     costado y el texto de la descripción fluye/rodea su contorno
     (arriba, al lado y por debajo una vez que la imagen termina),
     en vez de quedar en una columna aparte del mismo alto. El
     texto sigue justificado (ver .player-desc más arriba).
     ============================================================ */
  .player-desc-row{ display:block; }
  .player-desc-row::after{ content:''; display:table; clear:both; }
  .player-desc-image{
    float:right;
    width:min(148px,30vw);
    margin:0 0 12px 18px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    shape-outside:margin-box;
    shape-margin:14px;
  }
  .player-desc-image-card{
    width:100%; aspect-ratio:1/1;
    border-radius:16px; overflow:hidden;
    background:#fff;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(229,9,20,.08);
    padding:10px;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s, box-shadow .2s;
  }
  .player-desc-image-card:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 18px 42px rgba(0,0,0,.6), 0 0 0 1px rgba(229,9,20,.18);
  }
  .player-desc-image img{
    width:100%; height:100%; object-fit:contain; display:block; cursor:zoom-in;
    border-radius:6px;
  }
  .player-desc-image-hint{
    font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;
    text-align:center; white-space:nowrap;
  }
  @media (max-width:640px){
    .player-desc-image{ width:min(108px,26vw); margin:0 0 10px 14px; }
    .player-desc-image-hint{ display:none; }
  }

  /* ============================================================
     VISOR DE IMAGEN AMPLIADA (lightbox)
     Reemplaza el antiguo window.open(this.src), que en varios
     navegadores/apps móviles terminaba disparando la descarga de
     la imagen en vez de solo mostrarla más grande. Ahora se abre
     dentro de la misma página, sin navegar ni descargar nada.
     ============================================================ */
  .img-lightbox{
    position:fixed; inset:0; z-index:9999;
    background:rgba(6,6,8,.92);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center; justify-content:center;
    padding:32px;
    opacity:0; transition:opacity .18s ease;
  }
  .img-lightbox.show{ display:flex; opacity:1; }
  .img-lightbox-scroll{
    max-width:100%; max-height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:auto;
    border-radius:16px;
    scrollbar-width:thin;
    scrollbar-color:#5a5a62 transparent;
  }
  .img-lightbox-scroll::-webkit-scrollbar{ width:8px; height:8px; }
  .img-lightbox-scroll::-webkit-scrollbar-track{ background:transparent; }
  .img-lightbox-scroll::-webkit-scrollbar-thumb{
    background:#5a5a62; border-radius:20px;
  }
  .img-lightbox-scroll::-webkit-scrollbar-thumb:hover{ background:var(--red); }
  .img-lightbox-scroll img{
    display:block;
    max-width:min(90vw,720px);
    max-height:min(85vh,720px);
    width:auto; height:auto;
    object-fit:contain;
    border-radius:16px;
    background:#fff; padding:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
    cursor:default;
    margin:0 auto;
  }
  .img-lightbox-close{
    position:fixed; top:18px; right:22px; z-index:2;
    width:42px; height:42px; border-radius:50%;
    background:rgba(20,20,24,.85); border:1px solid var(--border);
    color:#fff; font-size:24px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .img-lightbox-close:hover{ background:var(--red); border-color:var(--red); }
  @media (max-width:640px){
    .img-lightbox{ padding:16px; }
    .img-lightbox-scroll img{ max-width:88vw; max-height:80vh; }
  }

  /* ============================================================
     AUTOPLAY TOGGLE (header)
     ============================================================ */
  .player-hdr-btn.pc-autoplay-btn{ width:auto; padding:0 12px; gap:7px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .player-hdr-btn.pc-autoplay-btn .ap-dot{ width:8px; height:8px; border-radius:50%; background:#4caf50; box-shadow:0 0 8px rgba(76,175,80,.7); transition:.15s; flex:0 0 auto; }
  .player-hdr-btn.pc-autoplay-btn.is-off .ap-dot{ background:#5a5a62; box-shadow:none; }
  .player-hdr-btn.pc-autoplay-btn.is-off{ color:var(--muted); }

  /* ============================================================
     SIGUIENTE / ANTERIOR (barra de controles)
     ============================================================ */
  .pc-btn.pc-next-prev[disabled]{ opacity:.3; cursor:not-allowed; }
  .pc-btn.pc-next-prev[disabled]:hover{ background:inherit; }

  /* ============================================================
     LAYOUT DEL REPRODUCTOR — estilo YouTube:
     video + descripción a la izquierda (una sola columna), lista
     "A continuación" fija a la derecha. La lista se ESTIRA para
     ocupar exactamente el mismo alto que la columna izquierda
     (video + descripción) y su contenido interno hace scroll
     dentro de ese alto, en vez de tener una altura fija propia
     que no coincide con la columna izquierda.
     ============================================================ */
  .player-content{
    display:flex;
    align-items:stretch;
    flex:1 1 auto; min-height:0; overflow:hidden;
  }
  .player-main{
    flex:1 1 0%;
    min-width:0; min-height:0;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#404040 transparent;
  }
  .player-main::-webkit-scrollbar{ width:6px; }
  .player-main::-webkit-scrollbar-track{ background:transparent; }
  .player-main::-webkit-scrollbar-thumb{
    background:#404040; border-radius:20px;
  }
  .player-main::-webkit-scrollbar-thumb:hover{ background:var(--red); }
  .player-sidebar{
    flex:0 0 360px;
    width:360px; max-width:360px;
    border-left:1px solid #1f1f1f;
    background:#141414;
    display:flex; flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  @media (max-width:1080px){
    .player-box{ max-height:none; }
    .player-content{ flex-direction:column; overflow:visible; min-height:0; }
    .player-sidebar{
      flex:1 1 auto; width:100%; max-width:100%;
      max-height:none; overflow:visible;
      border-left:none; border-top:1px solid #1f1f1f;
    }
  }

  /* ============================================================
     PLAYLIST "A CONTINUACIÓN"
     ============================================================ */
  .player-playlist{
    padding:20px 22px 22px;
    display:flex; flex-direction:column;
    flex:1 1 auto; min-height:0;
  }
  .player-playlist-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:12px; flex:0 0 auto;
  }
  .player-playlist-title{
    font-size:13px; font-weight:800; color:#fff; text-transform:uppercase; letter-spacing:.6px;
    display:flex; align-items:center; gap:7px;
  }
  .pc-autoplay-toggle{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    font-size:12px; color:var(--muted);
  }
  .pc-autoplay-toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .pc-autoplay-toggle .switch{
    width:34px; height:20px; border-radius:20px; background:#2a2a2a; border:1px solid #404040;
    position:relative; flex:0 0 auto; transition:.15s;
  }
  .pc-autoplay-toggle .switch::after{
    content:''; position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%;
    background:#c8c8cd; transition:.18s;
  }
  .pc-autoplay-toggle input:checked + .switch{ background:rgba(229,9,20,.55); border-color:var(--red); }
  .pc-autoplay-toggle input:checked + .switch::after{ transform:translateX(14px); background:#fff; }

  /* Buscador en tiempo real dentro de la lista "A continuación" */
  .player-playlist-search{
    width:100%; padding:9px 12px; margin-bottom:10px;
    border-radius:8px; border:1px solid var(--border);
    background:#181818; color:#fff; font-size:13px;
    flex:0 0 auto;
  }
  .player-playlist-search:focus{ outline:none; border-color:var(--red); }
  .player-playlist-empty{
    color:var(--muted); font-size:12.5px; text-align:center; padding:18px 6px;
  }

  .player-playlist-list{
    display:flex; flex-direction:column; gap:6px;
    flex:1 1 auto; min-height:0; overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:#404040 transparent;
  }
  .player-playlist-list::-webkit-scrollbar{ width:6px; }
  .player-playlist-list::-webkit-scrollbar-track{ background:transparent; }
  .player-playlist-list::-webkit-scrollbar-thumb{
    background:#404040; border-radius:20px;
  }
  .player-playlist-list::-webkit-scrollbar-thumb:hover{ background:var(--red); }
  @media (max-width:1080px){
    .player-playlist-list{ max-height:380px; }
  }
  .player-playlist-item{
    display:flex; align-items:center; gap:12px;
    width:100%; text-align:left; padding:8px; border-radius:8px;
    background:transparent; border:1px solid transparent; color:#e6e6ea; cursor:pointer;
    transition:.15s; font:inherit;
  }
  .player-playlist-item:hover{ background:#17171c; border-color:#2a2a2a; }
  .player-playlist-item.is-active{ background:rgba(229,9,20,.1); border-color:rgba(229,9,20,.3); cursor:default; }
  .pl-item-num{
    flex:0 0 auto; width:22px; text-align:center; font-size:12px; font-weight:700; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
  }
  .player-playlist-item.is-active .pl-item-num{ color:var(--red); }
  .pl-playing-icon{ width:14px; height:14px; fill:var(--red); }
  .pl-item-thumb{
    flex:0 0 auto; width:64px; height:38px; border-radius:6px; overflow:hidden;
    background:linear-gradient(135deg,#1c1c22,#111114); border:1px solid #2a2a2a;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .pl-item-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pl-item-info{ flex:1; min-width:0; }
  .pl-item-title{
    display:block; font-size:13px; font-weight:700; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pl-item-sub{
    display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;
    margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  @media (max-width:640px){
    .player-hdr-btn.pc-autoplay-btn span.ap-label{ display:none; }
    .player-hdr-btn.pc-autoplay-btn{ width:38px; padding:0; justify-content:center; }
  }

  .player-stage.is-audio{
    aspect-ratio:auto; min-height:clamp(380px, 55vw, 520px);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.05) 0%, transparent 60%),
      linear-gradient(160deg, #121214 0%, #0a0a0c 100%);
    padding:0;
    overflow:hidden;
  }
  .player-stage.is-audio video,
  .player-stage.is-audio > .player-media-inner{ display:none !important; }

  /* Acento "streaming de audio" (verde), aislado al reproductor de audio
     para no tocar la identidad roja del resto del sitio. */
  .player-stage.is-audio{ --acc:#1db954; --acc-dim:rgba(29,185,84,.35); }
  /* En audio no hay video que mostrar en PiP, y el control de velocidad
     no aplica de forma confiable ahí, así que se ocultan ambos. También
     se ocultan retroceder/avanzar 10s: en audio (streaming o no) no
     aportan valor real para el usuario. */
  .player-stage.is-audio .pc-settings-wrap,
  .player-stage.is-audio .pc-skip-btn,
  .player-stage.is-audio #pcPip{ display:none; }

  /* AURA VIVA: reemplaza el antiguo canvas de barras/onda. En vez de un
     ecualizador falso, dibuja 3 manchas de luz de color que respiran y
     orbitan muy lento detrás de la carátula. Se calma cuando el audio
     está en pausa (ver startAudioCanvas). */
  /* Este canvas solo se usa (y se dibuja) en modo audio. En modo video
     quedaba igual presente en el DOM, superpuesto al <video> con un
     filtro blur(38px) activo todo el tiempo — un costo de composición
     que escala con el área en pantalla: casi gratis en ventana chica,
     pero pesado a pantalla completa. Esto es, muy probablemente, la
     causa real del lag que solo aparece en fullscreen. Se oculta por
     completo en modo video para sacarlo de la cadena de renderizado. */
  .player-stage.is-video .audio-canvas{ display:none; }
  .audio-canvas{
    position:absolute; inset:0; width:100%; height:100%; z-index:1;
    pointer-events:none;
    filter:blur(38px) saturate(1.3);
    opacity:.9;
  }
  .audio-content{
    position:relative; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    width:100%; height:100%; text-align:center;
    padding: clamp(30px,6vw,50px) 20px clamp(110px,12vw,140px);
    min-width:0;
  }
  .audio-cover-wrap{
    position:relative; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    width:100%;
  }
  /* Carátula responsive y adaptable: se calcula con clamp() según el
     ancho de pantalla pero además queda acotada por la altura del
     escenario (vh) y por el ancho disponible (vw), así en pantallas
     bajitas/apaisadas (celular en horizontal, ventanas chicas) se
     encoge en vez de desbordar o recortarse. aspect-ratio:1/1 hace
     que el alto siga siempre al ancho calculado, sin giro.
     Look "look Spotify", sin giro: solo respira con un halo de luz
     al reproducir (ver .audio-cover.spinning más abajo). */
  .audio-cover{
    width:min(clamp(160px, 26vw, 260px), 60vw, 42vh);
    aspect-ratio:1/1;
    height:auto;
    max-width:100%;
    border-radius:18px; position:relative;
    background: linear-gradient(150deg, #1c1c22 0%, #0d0d10 60%, #050507 100%);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .audio-cover.spinning{ animation:coverGlow 3.2s ease-in-out infinite; }
  @keyframes coverGlow{
    0%, 100%{ box-shadow:0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 0 rgba(29,185,84,0); }
    50%{ box-shadow:0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 46px var(--acc-dim); }
  }
  .audio-cover img{ width:100%; height:100%; object-fit:cover; object-position:center; border-radius:17px; }
  .audio-cover .audio-icon-fallback{ font-size:clamp(56px, 9vw, 84px); opacity:.85; }
  .audio-title{
    font-size:clamp(18px, 2.6vw, 24px); font-weight:800; color:#fff;
    margin:0; width:100%; max-width:min(90%, 480px); min-width:0; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .audio-subtitle{
    font-size:12px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1.4px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    width:100%; max-width:min(90%, 480px); min-width:0;
  }
  .audio-now-playing{
    font-size:14px; color:#4fdf85; font-weight:600;
    min-height:20px; margin-top:4px;
    padding:6px 14px;
    background:rgba(29,185,84,.08);
    border:1px solid rgba(29,185,84,.25);
    border-radius:20px;
    max-width:min(90%, 420px); min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:inline-block;
  }
  .audio-now-playing:empty{ display:none; }

  @media (max-width:480px){
    .audio-cover{ width:min(clamp(140px, 40vw, 220px), 70vw, 36vh); }
  }
  @media (max-height:480px){
    .audio-content{ gap:12px; padding: 14px 20px clamp(90px,12vw,120px); }
    .audio-cover{ width:min(clamp(100px, 20vh, 200px), 30vw); }
  }

  .player-stage.is-audio .player-controls{
    background:linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.4) 55%, transparent 100%);
    padding:50px 20px 16px;
  }
  /* Acentos verdes solo dentro del reproductor de audio: el resto del
     sitio (video) conserva el rojo de marca intacto. */
  .player-stage.is-audio .pc-progress-fill{ background:linear-gradient(90deg, #14833f, var(--acc)); }
  .player-stage.is-audio .pc-progress-thumb{ box-shadow:0 0 0 3px var(--acc-dim); }
  .player-stage.is-audio .pc-btn.play-btn{
    background:var(--acc); color:#06120a; border-radius:50%;
    box-shadow:0 6px 20px var(--acc-dim);
  }
  .player-stage.is-audio .pc-btn.play-btn:hover{ background:#1ed760; transform:scale(1.04); }

  .media-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120%);
    background:rgba(20,20,24,.95); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px; padding:12px 18px 12px 12px;
    display:flex; align-items:center; gap:14px;
    min-width:280px; max-width:min(420px, 92vw);
    box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03) inset;
    z-index:9999;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.1), opacity .3s;
    opacity:0; pointer-events:none;
  }
  .media-toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1; pointer-events:auto;
  }
  .media-toast-art{
    width:48px; height:48px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(135deg, #181818, #0d0d10);
    border:1px solid rgba(229,9,20,.35);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-size:22px; color:var(--red);
  }
  .media-toast-art img{ width:100%; height:100%; object-fit:cover; }
  .media-toast-info{ flex:1; min-width:0; }
  .media-toast-title{
    font-size:13.5px; font-weight:700; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .media-toast-sub{
    font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.6px; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .media-toast-btn{
    background:var(--red); border:none; color:#fff;
    width:36px; height:36px; border-radius:50%; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:.15s; flex:0 0 auto;
  }
  .media-toast-btn:hover{ background:var(--red-hover); transform:scale(1.05); }
  .media-toast-btn svg{ width:16px; height:16px; fill:#fff; }

  /* ============================================================
     RESPONSIVE — nav (logo / buscador / usuario / campana)
     A partir de 900px el buscador de texto se oculta y aparece
     solo su ícono; al tocarlo se abre el overlay de búsqueda
     que ocupa todo el ancho del nav (sin empujar ni reordenar
     nada, así el nav nunca cambia de altura).
     ============================================================ */
  @media (max-width:900px){
    .nav-search{ display:none; }
    .search-toggle-btn{ display:inline-flex; }
  }

  @media (max-width:640px){
    .player-overlay{ padding:0; }
    .player-box{ max-width:100%; border-radius:0; min-height:100vh; display:flex; flex-direction:column; }
    .player-stage{ aspect-ratio:16/9; }
    .player-info{ flex:1; padding:16px 16px 24px; }
    .player-header{ padding:10px 12px; gap:8px; }
    .player-header-title{ font-size:14px; }
    .player-header-meta{ font-size:10px; }
    .player-logo{ font-size:12px; padding:4px 8px; }
    .pc-time{ display:none; }
    .pc-volume-slider{ display:none; }
    .media-toast{ bottom:14px; min-width:auto; max-width:calc(100vw - 24px); padding:10px 14px 10px 10px; }

    /* Título del contenido: en vez de cortarse feo con "...", se
       permiten hasta 2 líneas para poder leer nombres largos. */
    .player-info-top{ gap:10px; margin-bottom:10px; }
    .player-title{
      font-size:18px; white-space:normal;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; text-overflow:ellipsis;
    }
    .player-tags{ gap:6px; }
    .player-tag{ font-size:10px; padding:4px 9px; }

    /* Descripción más chica en celular, ya que las pantallas son pequeñas */
    .player-desc{ font-size:12.5px; line-height:1.55; }

    /* El botón grande de play central, algo más chico para no tapar
       tanto la escena en pantallas angostas. */
    .player-big-play{ width:64px; height:64px; }
    .player-big-play svg{ width:26px; height:26px; }

    /* Barra de controles del reproductor: botones más grandes (mejor
       área de toque) y, si aún así no entra todo, cada grupo
       (izquierda/derecha) scrollea de lado sin romper el diseño. */
    .player-controls{ padding:30px 10px 12px; }
    .pc-progress{ margin-bottom:14px; }
    .pc-bar{ flex-wrap:nowrap; gap:4px; }
    .pc-bar-left, .pc-bar-right{
      gap:4px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; min-width:0;
    }
    .pc-bar-left::-webkit-scrollbar, .pc-bar-right::-webkit-scrollbar{ display:none; }
    .pc-btn{ width:38px; height:38px; flex:0 0 auto; }
    .pc-btn.play-btn{ width:46px; height:46px; }
    .pc-btn svg{ width:19px; height:19px; }
    .pc-btn.play-btn svg{ width:22px; height:22px; }

    /* Lista "A continuación": miniaturas y texto más cómodos al tacto */
    .player-playlist{ padding:16px 14px 18px; }
    .player-playlist-item{ padding:10px 8px; gap:10px; }
    .pl-item-thumb{ width:72px; height:42px; }
    .pl-item-title{ font-size:13.5px; }
  }

  @media (max-width:480px){
    .nav{ gap:8px; }
    .nav-logo-text{ display:none; }
    .hero-actions .btn{ padding:11px 18px; font-size:14px; }
    .nav-user-name{ max-width:70px; }

    /* Reproductor en pantallas muy chicas: menos aire desperdiciado
       y controles un poco más compactos, sin perder área de toque. */
    .player-info{ padding:14px 14px 20px; }
    .player-title{ font-size:16.5px; }
    .player-desc-image{ width:min(92px,24vw); margin:0 0 10px 12px; }
    .pc-btn{ width:36px; height:36px; }
    .pc-btn.play-btn{ width:44px; height:44px; }
    .pl-item-thumb{ width:60px; height:36px; }
    .pl-item-sub{ display:none; }
  }

  @media (max-width:360px){
    .nav-user{ gap:6px; }
    .nav-user-name{ max-width:50px; }
    .notif-bell, .nav-icon-btn{ width:36px; height:36px; }

  @media (min-width:1600px){

  .player-stage:fullscreen,

    width:100vw !important;
    height:100vh !important;
    max-height:100vh !important;
    aspect-ratio:auto !important;
    border-radius:0 !important;

  }
  .player-stage:fullscreen video,
  .player-stage:-webkit-full-screen video,
  .player-stage:fullscreen img,
  .player-stage:-webkit-full-screen img{

  .player-stage:fullscreen img,

  /* Overlay que cubre TODO mientras se confirma que esta sesión
     pertenece a este navegador (evita mostrar el nombre de usuario
     o el catálogo si el link se copió/pegó desde otro navegador). */
  .device-check-overlay{
    position:fixed; inset:0; z-index:9999; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:var(--muted); font-size:13px;
  }
  .device-check-spinner{

    border:3px solid var(--border); border-top-color:var(--red);
    animation:dcspin .8s linear infinite;
  }
  @keyframes dcspin{ to{ transform:rotate(360deg); } }

  /* ===== Modal "Copiar enlace" (reemplaza window.prompt) ===== */
  .share-modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); backdrop-filter:blur(4px);
    z-index:9998; align-items:center; justify-content:center; padding:16px;
  }
  .share-modal-overlay.open{ display:flex; animation:smfade .2s ease; }
  @keyframes smfade{ from{opacity:0} to{opacity:1} }
  .share-modal{
    background:linear-gradient(180deg, #17171c, #181818);
    border-radius:12px; width:100%; max-width:420px;

  .share-modal-row{ display:flex; gap:8px; }

    background:#141414; color:var(--text); font-size:13px;

  /* ============================================================
     AJUSTES MÓVIL / PANTALLA PEQUEÑA
     Bloque agregado al final para refinar la experiencia en celular
     (carrusel, filas de cards, nav, notificaciones y reproductor).
     Solo sobrescribe lo necesario en pantallas chicas / touch; el
     diseño de escritorio no cambia.
     ============================================================ */
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  button, .card, .hero-dot, .hero-arrow, .nav-icon-btn, .notif-bell{
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }

  /* Touch: sin "hover pegado" (en celular el último elemento tocado
     quedaba agrandado) y con feedback al presionar. */
  @media (hover:none){
    .card:hover{
      transform:translateZ(0); z-index:auto;
      border-color:rgba(255,255,255,.08); box-shadow:0 4px 14px rgba(0,0,0,.35);
    }
    .card:active{ transform:scale(.97); }
    .btn-play:hover{ transform:none; background:#fff; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    .btn-play:active{ transform:scale(.97); background:#ececec; }
    .nav-icon-btn:hover, .notif-bell:hover{ transform:none; }
    .row-track{ cursor:default; }
  }

  @media (max-width:640px){
    :root{ --card-w:clamp(110px, 33vw, 150px); --row-pb:18px; }

    /* ---- Nav ---- */
    .nav{ gap:8px; }
    .nav-logo-mark{ width:30px; height:30px; border-radius:8px; font-size:14px; }
    .nav-logo-mark img{ border-radius:8px; }
    .nav-right{ gap:6px; }
    .nav-icon-btn, .notif-bell{ width:34px; height:34px; }
    .nav-ico{ width:16px; height:16px; }
    .nav-user{ height:34px; }
    .nav-user-avatar{ width:26px; height:26px; font-size:11px; }
    .nav-user-name{ font-size:12px; }
    .nav-user-logout{ width:28px; height:28px; }
    .notif-badge{ min-width:16px; height:16px; font-size:9px; top:-3px; right:-3px; }
    .notif-panel-title{ font-size:13px; padding:12px 14px 8px; }
    .notif-item{ font-size:12px; padding:10px 14px; }

    /* ---- Notificaciones: panel a lo ancho de la pantalla ---- */
    .notif-panel{
      position:fixed; top:calc(var(--nav-h) + 6px); left:12px; right:12px;
      width:auto; max-height:70vh; border-radius:16px;
    }

    /* ---- Carrusel ---- */
    .hero-slide::after{
      background:linear-gradient(180deg, rgba(15,15,18,.35) 0%, rgba(15,15,18,0) 22%, rgba(15,15,18,.55) 58%, rgba(15,15,18,.92) 82%, var(--bg) 100%);
    }

    .hero-tag{ font-size:9px; letter-spacing:1px; padding:3px 8px; margin-bottom:6px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .hero-title{
      font-size:clamp(17px, 5vw, 22px); line-height:1.15; margin:0 0 10px;
      -webkit-line-clamp:2;
    }
    .hero-actions{ gap:8px; }
    .hero-actions .btn{ padding:8px 16px; font-size:12.5px; gap:6px; }
    /* Se navega con swipe y puntos: las flechas solo tapaban la imagen */
    .hero-arrow{ display:none !important; }
    /* Los puntos nunca pueden pasar del ancho de la pantalla: si hay
       muchos destacados, el grupo se queda acotado y desliza de lado. */
    .hero-dots{
      bottom:6px; gap:7px; align-items:center;
      width:max-content; max-width:calc(100% - 32px);
      padding:10px 4px; overflow-x:auto; overflow-y:hidden;
      scrollbar-width:none; -ms-overflow-style:none;
    }
    .hero-dots::-webkit-scrollbar{ display:none; }
    .hero-dot{ flex:0 0 auto; width:7px; height:7px; min-width:0; min-height:0; position:relative; }
    .hero-dot::before{ content:''; position:absolute; inset:-9px -3px; }
    .hero-dot.active{ width:20px; }

    /* ---- Filas de cards ---- */
    .rows{ padding-top:10px; padding-bottom:40px; }
    .row-title{ font-size:14px; gap:8px; }
    .row-title::before{ width:3px; }
    .row-track{
      gap:8px; padding-top:8px;
      overscroll-behavior-x:contain;
      scroll-snap-type:x proximity;
    }
    .card{ border-radius:8px; }
    .card-overlay{ font-size:10px; padding:14px 7px 5px; }
    .card-badge{ top:5px; left:5px; font-size:8px; padding:2px 6px; }
    .card .placeholder{ font-size:24px; }
    .card-play{ display:none; }
    .row-track-wrap::before, .row-track-wrap::after{ width:24px; }
    .empty-state{ padding:60px 20px; }

    /* ---- Reproductor ---- */
    .player-box{ min-height:100vh; min-height:100dvh; }
    .player-stage.is-audio{ min-height:clamp(360px, 92vw, 460px); }

  /* Celular en horizontal: carrusel más bajo para ver contenido debajo */
  @media (max-height:480px) and (orientation:landscape){
    .hero-carousel{ height:clamp(260px, 62vh, 360px); }
    .hero-title{ font-size:clamp(18px, 4vw, 24px); margin-bottom:10px; }
    .hero-content{ padding-bottom:40px; }
  }
  /* ============================================================
     EFECTOS DEL CARRUSEL (móvil, pantalla pequeña y pantallas grandes)
     - Entrada escalonada del contenido (etiqueta, título, botón)
     - Zoom suave tipo cine con movimiento (Ken Burns) alterno
     - Destello de luz al cambiar de slide
     - Brillo en la etiqueta y pulso en el botón Reproducir
     - Puntos y barra de progreso con más vida
     Solo usa transform/opacity (livianos). Se desactiva con
     "reducir movimiento" del sistema.
     ============================================================ */
  @keyframes heroRise{
    from{ opacity:0; transform:translateY(18px); }
    to  { opacity:1; transform:translateY(0); }
  }
  @keyframes heroSlideLeft{
    from{ opacity:0; transform:translateX(-34px); }
    to  { opacity:1; transform:translateX(0); }
  }
  @keyframes heroKenBurns{
    from{ transform:scale(1.02) translate3d(0,0,0); }
    to  { transform:scale(1.09) translate3d(-1.2%,-.8%,0); }
  }
  @keyframes heroSheen{
    0%  { transform:translateX(0) skewX(-18deg); opacity:0; }
    20% { opacity:1; }
    100%{ transform:translateX(480%) skewX(-18deg); opacity:0; }
  }
  @keyframes heroTagShine{
    0%, 55%{ transform:translateX(-130%) skewX(-20deg); }
    100%   { transform:translateX(330%) skewX(-20deg); }
  }
  @keyframes heroPulse{
    0%  { box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 0 0 rgba(255,255,255,.5); }
    70% { box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 0 14px rgba(255,255,255,0); }
    100%{ box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 0 0 rgba(255,255,255,0); }
  }

  /* Imagen: zoom + leve desplazamiento; el origen alterna por slide */
  .hero-slide.active .hero-bg{ animation:heroKenBurns 10s ease-out forwards; }
  .hero-slide:nth-child(even) .hero-bg{ transform-origin:68% 42%; }
  .hero-slide:nth-child(odd) .hero-bg{ transform-origin:32% 58%; }

  /* Destello de luz que cruza el slide al aparecer */
  .hero-slide::before{
    content:''; position:absolute; top:0; bottom:0; left:-45%; width:38%;
    z-index:1; pointer-events:none; opacity:0;
    background:linear-gradient(100deg, transparent 0%, rgba(255,255,255,.12) 50%, transparent 100%);
    transform:translateX(0) skewX(-18deg);
  }
  .hero-slide.active::before{ animation:heroSheen 1.5s ease-out .15s 1 both; }

  /* Entrada escalonada del contenido */
  .hero-slide.active .hero-tag,
  .hero-slide.active .hero-title,
  .hero-slide.active .hero-actions{ animation:heroRise .7s cubic-bezier(.2,.8,.2,1) both; }
  .hero-slide.active .hero-tag{ animation-delay:.2s; }
  .hero-slide.active .hero-title{ animation-delay:.34s; }
  .hero-slide.active .hero-actions{ animation-delay:.5s; }

  /* Etiqueta "Destacado": barrido de brillo periódico */
  .hero-tag{ position:relative; overflow:hidden; }
  .hero-tag::after{
    content:''; position:absolute; top:0; bottom:0; left:0; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform:translateX(-130%) skewX(-20deg); pointer-events:none;
  }
  .hero-slide.active .hero-tag::after{ animation:heroTagShine 4.2s ease-in-out 1s infinite; }

  /* Botón Reproducir: anillo que pulsa suave */
  .hero-slide.active .btn-play{ animation:heroPulse 2.6s ease-out 1.5s infinite; }
  .btn-play:active{ transform:scale(.96); }

  /* Puntos y barra de progreso */
  .hero-dot{ transition:width .4s cubic-bezier(.2,.8,.2,1), background .25s ease, box-shadow .3s ease; }
  .hero-progress-bar{ box-shadow:0 0 10px rgba(229,9,20,.75); }

  /* Pantallas grandes: el texto entra deslizándose desde la izquierda
     y el movimiento del fondo es un poco más amplio */
  @media (min-width:769px){
    .hero-slide.active .hero-tag,
    .hero-slide.active .hero-title,
    .hero-slide.active .hero-actions{ animation-name:heroSlideLeft; animation-duration:.8s; }
    .hero-slide.active .hero-bg{ animation-duration:12s; }
  }

  /* Móvil / pantalla pequeña: movimiento más corto y sutil para que
     el texto no se sienta pesado ni se salga del encuadre */
  @media (max-width:640px){
    @keyframes heroRise{
      from{ opacity:0; transform:translateY(12px); }
      to  { opacity:1; transform:translateY(0); }
    }
    .hero-slide.active .hero-tag,
    .hero-slide.active .hero-title,
    .hero-slide.active .hero-actions{ animation-duration:.55s; }
    .hero-slide.active .hero-tag{ animation-delay:.12s; }
    .hero-slide.active .hero-title{ animation-delay:.22s; }
    .hero-slide.active .hero-actions{ animation-delay:.34s; }
    .hero-slide.active .hero-bg{ animation-duration:8s; }
    .hero-slide.active::before{ animation-duration:1.2s; }
  }

  @media (prefers-reduced-motion:reduce){
    .hero-slide.active .hero-bg,
    .hero-slide.active::before,
    .hero-slide.active .hero-tag,
    .hero-slide.active .hero-title,
    .hero-slide.active .hero-actions,
    .hero-slide.active .hero-tag::after,
    .hero-slide.active .btn-play{ animation:none !important; }
  }
  /* ===== PUBLICIDAD (estilo YouTube) ===== */
  .ad-layer{ position:absolute; inset:0; z-index:200; background:#000; display:none; align-items:center; justify-content:center; overflow:hidden; }
  .ad-layer.show{ display:flex; animation:adIn .6s cubic-bezier(.2,.8,.2,1); }
  .ad-layer.leaving{ animation:adOut .4s ease forwards; }
  @keyframes adIn{ from{ opacity:0; transform:scale(1.08); filter:blur(10px) brightness(2.2); } to{ opacity:1; transform:scale(1); filter:none; } }
  @keyframes adOut{ to{ opacity:0; transform:scale(.97); } }
  .ad-flash{ position:absolute; inset:0; z-index:199; pointer-events:none; background:#fff; opacity:0; }
  .ad-flash.go{ animation:adFlash .65s ease; }
  @keyframes adFlash{ 0%{ opacity:0; } 30%{ opacity:.5; } 100%{ opacity:0; } }
  .player-stage.ad-incoming #playerMediaMount{ filter:grayscale(1) brightness(.3) blur(4px); transform:scale(.97); transition:filter .5s ease, transform .5s ease; }
  /* En modo audio el CSS del reproductor oculta todo <video> (display:none !important); el video del anuncio debe verse igual. */
  .player-stage.is-audio .ad-layer video.ad-media,
  .player-stage.is-audio .ad-layer img.ad-media{ display:block !important; }
  /* El anuncio se ajusta al reproductor completo (sin recortarse), ganando a las reglas generales de video/img del escenario (cover / max-height:70vh), también en pantalla completa y en modo audio. */
  .player-stage .ad-layer .ad-media,
  .player-stage:fullscreen .ad-layer .ad-media,
  .player-stage:-webkit-full-screen .ad-layer .ad-media{
    position:absolute !important; inset:0 !important; width:100% !important; height:100% !important;
    max-width:none !important; max-height:none !important; object-fit:contain !important;
    background:transparent !important; display:block !important; z-index:1; transform:none !important;
  }
  .ad-bg{ position:absolute; inset:-24px; z-index:0; background-size:cover; background-position:center; filter:blur(24px) brightness(.45); }
  .ad-badge{ position:absolute; top:12px; left:12px; z-index:3; background:#fbc02d; color:#000; font-weight:800; font-size:11px; letter-spacing:.8px; padding:4px 9px; border-radius:4px; }
  .ad-count{ position:absolute; top:12px; right:12px; z-index:3; background:rgba(0,0,0,.7); color:#fff; font-size:12px; font-weight:600; padding:4px 9px; border-radius:4px; }
  .ad-skip{ position:absolute; right:0; bottom:22px; z-index:3; background:rgba(20,20,20,.85); color:#fff; border:1px solid rgba(255,255,255,.5); border-right:none; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; }
  .ad-skip:disabled{ opacity:.7; cursor:default; }
  .ad-skip:not(:disabled):hover{ background:#fff; color:#000; }
  .ad-link{ position:absolute; left:12px; bottom:22px; z-index:3; background:rgba(0,0,0,.7); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:4px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .ad-link:hover{ background:#fff; color:#000; }
  .ad-sound{ position:absolute; left:50%; bottom:64px; transform:translateX(-50%); z-index:3; background:#fff; color:#000; border:none; border-radius:20px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .ad-progress{ position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.2); z-index:3; }
  .ad-progress i{ display:block; height:100%; width:0; background:#fbc02d; }
</style>

<script>
  // ============================================================

  var allMedia = [];

  // que el contenido abierto) + posición dentro de esa cola, y si el

  // misma card o sobre cards distintas disparen reproducciones
  // superpuestas: mientras se está deteniendo lo anterior para arrancar

  var USER_TOKEN = "<?= userToken ?>";
  var BASE_URL = "<?= baseUrl ?>";
  var brandName_ = "<?= brand.brandName ?>";
  var brandSubname_ = "<?= brand.brandSubname ?>";

  // ============================================================
  //  DETECCIÓN DE BACKEND (Apps Script) + DATOS DE DEMOSTRACIÓN
  //  Si esta página se abre fuera de un despliegue de Apps Script
  //  (por ejemplo, el archivo .html abierto directo en el navegador
  //  para revisar el diseño), google.script.run no existe y antes
  //  se rompía todo en silencio: el carrusel y las filas quedaban
  //  vacíos. Ahora, SOLO en ese caso, se usa un catálogo de muestra
  //  para poder ver el carrusel, las cards y el reproductor
  //  funcionando. Cuando esta página corre dentro de Apps Script de
  //  verdad, google.script.run existe y este modo nunca se activa:
  //  la lógica real (getMedia, getNotificaciones, sesión, etc.) sigue
  //  intacta y es la que manda.
  // ============================================================
  function hasGasBackend_(){
    try { return typeof google !== 'undefined' && !!google.script && !!google.script.run; }
    catch(e){ return false; }
  }
  function getDemoMedia_(){
