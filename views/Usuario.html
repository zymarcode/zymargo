        miniatura:'https://picsum.photos/seed/voices6/500/500',
        descripcion:'Charlas íntimas con artistas emergentes.', destacado:false }
    ];
  }

  // ============================================================
  //  EVITAR VISTA CACHEADA AL VOLVER CON "ATRÁS" (bfcache)
  //  Si el navegador restaura esta página desde su caché (por
  //  ejemplo tras cerrar sesión y pulsar "atrás"), forzamos una
  //  recarga real contra el servidor para que vuelva a validar
  //  el token. Si ya no es válido, doGet() mostrará el login.
  // ============================================================
  window.addEventListener('pageshow', function(event){
    if (event.persisted){
      window.location.reload();
    }
  });

  // ============================================================
  //  VISOR DE IMAGEN AMPLIADA (imagen de la descripción, ej. QR)
  //  Se muestra dentro de la misma página en vez de usar
  //  window.open(), que en algunos navegadores/apps móviles
  //  dispara la descarga de la imagen en vez de solo ampliarla.
  // ============================================================
  function openImgLightbox(src){
    if(!src) return;
    var box = document.getElementById('imgLightbox');
    var img = document.getElementById('imgLightboxImg');
    var scroll = document.getElementById('imgLightboxScroll');
    img.src = src;
    box.classList.add('show');
    if(scroll){ scroll.scrollTop = 0; scroll.scrollLeft = 0; }
    document.addEventListener('keydown', imgLightboxEscHandler_);
  }
  function closeImgLightbox(event){
    if(event) event.stopPropagation();
    var box = document.getElementById('imgLightbox');
    box.classList.remove('show');
    document.getElementById('imgLightboxImg').src = '';
    document.removeEventListener('keydown', imgLightboxEscHandler_);
  }
  function imgLightboxEscHandler_(e){
    if(e.key === 'Escape') closeImgLightbox();
  }

  // ============================================================
  //  LOGOUT DE USUARIO
  // ============================================================
  function doUserLogout(){
    if(USER_TOKEN){
      google.script.run.logoutUser(USER_TOKEN);
    }
    window.top.location.href = BASE_URL + '?page=login';
  }

  // ============================================================
  //  ANTI-COPIA DE SESIÓN ENTRE NAVEGADORES
  //  El token de sesión llega por la URL, así que copiar el link
  //  a otro navegador también "copiaba" la sesión iniciada. Para
  //  evitarlo, cada sesión queda atada a un identificador propio
  //  del navegador (guardado en localStorage, NO en la URL). Si
  //  el navegador que abre el link no tiene ese identificador, la
  //  sesión se cierra automáticamente.
  // ============================================================
  function getDeviceId_(){
    var KEY = 'sf_device_id';
    try {
      var id = localStorage.getItem(KEY);
      if(!id){
        id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,12);
        localStorage.setItem(KEY, id);
      }
      return id;
    } catch(e){
      try {
        var sid = sessionStorage.getItem(KEY);
        if(!sid){
          sid = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,12);
          sessionStorage.setItem(KEY, sid);
        }
        return sid;
      } catch(e2){
        return 'dev_nostorage_' + Date.now().toString(36);
      }
    }
  }

  function bootUsuario(){
    if(!hasGasBackend_()){
      // Sin backend de Apps Script disponible (vista previa fuera del
      // despliegue real): se quita el overlay de verificación y se
      // carga el catálogo de demostración para poder ver el diseño.
      var overlay0 = document.getElementById('deviceCheckOverlay');
      if(overlay0) overlay0.remove();
      loadAll();
      loadNotificaciones();
      return;
    }
    if(!USER_TOKEN){
      // Modo invitado (catálogo público, sin sesión): no hay overlay
      // que quitar ni nada que validar.
      loadAll();
      loadNotificaciones();
      return;
    }
    google.script.run
      .withSuccessHandler(function(match){
        if(!match){
          // No coincide el dispositivo: NO se revela el catálogo ni
          // el nombre de usuario, se manda directo al login
          // manteniendo el overlay encima todo el tiempo.
          window.top.location.href = BASE_URL + '?page=login';
          return;
        }
        var overlay = document.getElementById('deviceCheckOverlay');
        if(overlay) overlay.remove();
        loadAll();
        loadNotificaciones();
      })
      .withFailureHandler(function(){
        window.top.location.href = BASE_URL + '?page=login';
      })
      .checkSessionDevice(USER_TOKEN, getDeviceId_());
  }

  // ============================================================
  //  BUSCADOR (escritorio + overlay móvil sincronizados)
  // ============================================================
  function handleSearchInput(val){
    var desktopInput = document.getElementById('searchInput');
    var mobileInput = document.getElementById('searchInputMobile');
    if(desktopInput && desktopInput.value !== val) desktopInput.value = val;
    if(mobileInput && mobileInput.value !== val) mobileInput.value = val;

    var clearBtn = document.getElementById('searchClearBtn');
    if(clearBtn) clearBtn.style.display = val ? 'inline-flex' : 'none';
    var searchBox = document.getElementById('navSearchBox');
    if(searchBox) searchBox.classList.toggle('has-value', !!val);

    renderRows();
  }

  function openSearchOverlay(){
    document.getElementById('navSearchOverlay').classList.add('open');
    document.getElementById('nav').classList.add('search-mode');
    setTimeout(function(){
      var input = document.getElementById('searchInputMobile');
      if(input) input.focus();
    }, 60);
  }

  function closeSearchOverlay(){
    document.getElementById('navSearchOverlay').classList.remove('open');
    document.getElementById('nav').classList.remove('search-mode');
  }

  function clearSearchMobile(){
    handleSearchInput('');
    var input = document.getElementById('searchInputMobile');
    if(input) input.focus();
  }

  function clearSearchDesktop(){
    handleSearchInput('');
    var input = document.getElementById('searchInput');
    if(input) input.focus();
  }

  // Atajo: "/" enfoca el buscador (solo escritorio, fuera de campos de texto y del reproductor)
  document.addEventListener('keydown', function(e){
    if(e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    var player = document.getElementById('playerOverlay');
    if(player && player.classList.contains('open')) return;

  // ============================================================
  //  UTILIDADES
  // ============================================================
  function fixDropbox(url){
    if (!url) return url;
    if (url.indexOf('dropbox.com') === -1) return url;
    if (/[?&]dl=1/.test(url)) return url;
    if (/[?&]dl=0/.test(url)) return url.replace('dl=0', 'dl=1');
    return url + (url.indexOf('?') === -1 ? '?dl=1' : '&dl=1');
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function descImgError(img, url){
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = url;
    if(img && img.parentNode) img.parentNode.replaceChild(a, img);
  }
  function extractDescImage(text){
    if(!text) return { text: text, imageUrl: null };
    var isImageUrl = /^https?:\/\/[^\s<]+\.(jpe?g|png|gif|webp|svg|bmp)(\?\S*)?$/i;
    var urlRegex = /(https?:\/\/[^\s<]+)/g;
    var match, found = null;
    while((match = urlRegex.exec(text)) !== null){
      if(isImageUrl.test(match[1])){ found = match[1]; break; }
    }
    if(!found) return { text: text, imageUrl: null };
    var cleaned = text.split(found).join('').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return { text: cleaned, imageUrl: found };
  }
  function linkifyDescription(text){
    if(!text) return 'Sin descripción.';
    var safe = esc(text);
    var isImageUrl = /\.(jpe?g|png|gif|webp|svg|bmp)(\?[^\s<]*)?$/i;
    var linked = safe.replace(/(https?:\/\/[^\s<]+)/g, function(url){
      var cleanUrl = url.replace(/(&amp;)+$/, '');
      if(isImageUrl.test(cleanUrl)){
        return '<img src="'+cleanUrl+'" alt="" class="desc-img" loading="lazy" referrerpolicy="no-referrer" onclick="event.stopPropagation();openImgLightbox(this.src)" onerror="descImgError(this,this.src)" />';
      }
      return '<a href="' + cleanUrl + '" target="_blank" rel="noopener">' + cleanUrl + '</a>';
    });
    return linked.replace(/\n/g, '<br>');
  }
  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    if(h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return m + ':' + String(sec).padStart(2,'0');
  }
  function isHlsUrl(url){ return /\.m3u8(\?|$)/i.test(url || ''); }
  function isAudioType(t){ return t === 'audio' || t === 'audio.'; }
  function isIcecastUrl(url){
    if(!url) return false;
    // Señales explícitas de un stream de radio en vivo (Icecast/Shoutcast).
    if (/icecast|shoutcast|\/stream\b|\/live\b|\.audio(\?|$)/i.test(url)) return true;
    // ARREGLO: antes, si la URL NO terminaba en una extensión de audio
    // conocida, se asumía que era un stream en vivo y se intentaba
    // reproducir con IcecastMetadataPlayer. Esto rompía audios normales
    // subidos a Drive/Dropbox/etc. cuyo enlace no termina literalmente
    // en ".mp3" (por ejemplo enlaces tipo "...uc?id=XXXX"), haciendo que
    // el play/pausa se comportara mal (el reproductor de radio no tiene
    // "pausa" real, solo detiene/reinicia el stream). Ahora, sin una
    // señal explícita de radio en vivo, siempre se trata como un
    // archivo de audio normal (más seguro y predecible).
    return false;
  }

  // ============================================================
  //  PLAYLIST AUTOMÁTICA ("a continuación")
  //  Arma una cola con contenidos del mismo tipo (video/audio) y,
  //  si hay suficientes, de la misma categoría, para poder pasar
  //  al siguiente automáticamente y mostrar la lista en el player.
  // ============================================================
  function sameKind_(t1, t2){
    var a = isAudioType(t1) ? 'audio' : t1;
    var b = isAudioType(t2) ? 'audio' : t2;
    return a === b;
  }
  function buildPlaylistFor_(media){
    if(!media || (media.tipo !== 'video' && !isAudioType(media.tipo))) return [];
    var sameCategory = allMedia.filter(function(x){
      return sameKind_(x.tipo, media.tipo) && (x.categoria || '') === (media.categoria || '');
    });
    if(sameCategory.length > 1) return sameCategory;
    var sameType = allMedia.filter(function(x){ return sameKind_(x.tipo, media.tipo); });
    return sameType;
  }

  // ============================================================
  //  HERO CARRUSEL
  // ============================================================
  var heroItems = [];
  var heroIndex = 0;
  var heroTimer = null;
  var heroAutoplayMs = 6000;
  var heroProgressTimer = null;
  var heroProgressStart = 0;
  var heroPaused = false;
  var heroTouchStartX = 0;

  // Orden de las categorías en el carrusel. Edita esta lista a tu gusto:
  // coincide sin importar mayúsculas ni tildes ("televisión" = "Television",
  // "Radios" = "Radio"). Las categorías que no estén aquí van después,
  // en orden alfabético. Dentro de cada categoría se respeta el "Orden".
  var HERO_CATEGORY_ORDER = ['radio', 'television', 'tv', 'canal', 'pelicula', 'serie', 'documental', 'musica'];

  function heroNorm_(v){
    return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function heroCategoryRank_(cat){
    var c = heroNorm_(cat);
    for(var i = 0; i < HERO_CATEGORY_ORDER.length; i++){
      if(c.indexOf(HERO_CATEGORY_ORDER[i]) !== -1) return i;
    }
    return HERO_CATEGORY_ORDER.length;
  }
  function heroSortByCategory_(list){
    return list.map(function(m, i){ return { m:m, i:i, r:heroCategoryRank_(m.categoria) }; })
      .sort(function(a, b){
        if(a.r !== b.r) return a.r - b.r;
        if(a.r === HERO_CATEGORY_ORDER.length){
          var ca = heroNorm_(a.m.categoria), cb = heroNorm_(b.m.categoria);
          if(ca !== cb) return ca < cb ? -1 : 1;
        }
        return a.i - b.i;
      })
      .map(function(x){ return x.m; });
  }

  function renderHero(){
    var wrap = document.getElementById('heroSection');
    if(heroTimer) { clearTimeout(heroTimer); heroTimer = null; }
    if(heroProgressTimer) { clearInterval(heroProgressTimer); heroProgressTimer = null; }
    wrap.querySelectorAll('.hero-slide').forEach(function(el){ el.remove(); });

    var candidates = allMedia.filter(function(m){ return m.destacado; });
    if(candidates.length === 0) candidates = allMedia.slice(0, 5);
    if(candidates.length === 0){ wrap.style.display = 'none'; return; }
    candidates = heroSortByCategory_(candidates);
    wrap.style.display = 'block';

    heroItems = candidates;
    heroIndex = 0;

    var ref = document.getElementById('heroPrev');
    candidates.forEach(function(m, i){
      var slide = document.createElement('div');
      slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
      // Imagen propia del carrusel (miniaturaCarrusel). Si no tiene, usa
      // la miniatura de la card, y por último la URL si es una imagen.
      var bg = m.miniaturaCarrusel || m.miniatura || (m.tipo === 'image' ? m.url : '');
      var isAud = isAudioType(m.tipo);
      if(isAud) slide.className += ' is-audio-slide';
      if(!bg) slide.className += ' no-img';
      // Audio: si la imagen (de carrusel o carátula de la card) es cuadrada o
      // vertical se muestra completa (no recortada); si es horizontal 16:9
      // (imagen de carrusel) llena todo el banner. Lo decide heroFitSlide_.
      if(isAud && bg) slide.setAttribute('data-square-art', '1');

      // Usamos un <img> real en vez de background-image para que el zoom
      // con transform:scale() sea estable en móvil y no parta la imagen.
      slide.innerHTML =
        (bg ? '<img class="hero-backdrop" src="'+esc(bg)+'" alt="" aria-hidden="true" draggable="false" decoding="async" />' +
              '<img class="hero-bg" src="'+esc(bg)+'" alt="" draggable="false" decoding="async" />' : '') +
        // Ícono de respaldo: se ve si el contenido no tiene imagen o ésta falla
        '<div class="hero-fallback" aria-hidden="true">'+(isAud ? '🎧' : m.tipo === 'video' ? '🎬' : '🖼️')+'</div>' +
        '<div class="hero-content">' +
          '<div class="hero-tag">Destacado' + (m.categoria && heroNorm_(m.categoria) !== 'general' ? ' · ' + esc(m.categoria) : '') + '</div>' +
          '<h1 class="hero-title" title="'+esc(m.nombre)+'">'+esc(m.nombre)+'</h1>' +
          '<div class="hero-actions">' +
            '<button class="btn btn-play" data-media-id="'+esc(m.id)+'">▶ Reproducir</button>' +
          '</div>' +
        '</div>';

      wrap.insertBefore(slide, ref);

      // Ajuste inteligente de la imagen (cover / contain con fondo desenfocado)
      var heroImg = slide.querySelector('.hero-bg');
      if(heroImg){
        if(heroImg.complete && heroImg.naturalWidth) heroFitSlide_(slide);
        else heroImg.addEventListener('load', function(){ heroFitSlide_(slide); });
        heroImg.addEventListener('error', function(){
          heroImg.style.display = 'none';
          var bd = slide.querySelector('.hero-backdrop');
          if(bd) bd.style.display = 'none';
          slide.classList.add('no-img');
        });
      }
    });

    var dots = document.getElementById('heroDots');
    dots.innerHTML = candidates.map(function(_, i){
      return '<button class="hero-dot'+(i===0?' active':'')+'" data-hero-index="'+i+'" aria-label="Ir al destacado '+(i+1)+'"></button>';
    }).join('');

    document.getElementById('heroPrev').style.display = candidates.length > 1 ? '' : 'none';
    document.getElementById('heroNext').style.display = candidates.length > 1 ? '' : 'none';
    dots.style.display = candidates.length > 1 ? '' : 'none';

    // Bind hero play buttons
    wrap.querySelectorAll('.btn-play[data-media-id]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        var id = btn.getAttribute('data-media-id');
        if(id) openPlayerById(id);
      });
    });

    // Bind dots
    wrap.querySelectorAll('.hero-dot[data-hero-index]').forEach(function(dot){
      dot.addEventListener('click', function(){
        var idx = parseInt(dot.getAttribute('data-hero-index'), 10);
        heroGoTo(idx);
        heroRestartAutoplay();
        heroResetProgress();
      });
    });

    wrap.onmouseenter = function(){ heroPaused = true; };
    wrap.onmouseleave = function(){ heroPaused = false; heroRestartAutoplay(); };

    if(!wrap.dataset.swipeBound){
      wrap.dataset.swipeBound = '1';
      wrap.addEventListener('touchstart', function(e){
        heroTouchStartX = e.touches[0].clientX;
      }, {passive:true});
      wrap.addEventListener('touchend', function(e){
        var dx = e.changedTouches[0].clientX - heroTouchStartX;
        if(Math.abs(dx) > 40){
          if(dx < 0) heroNext(); else heroPrev();
        }
      }, {passive:true});
    }

    heroScheduleAutoplay();
    heroResetProgress();
  }

  // Decide cómo encaja la imagen del slide en el carrusel:
  //  - proporción parecida  -> cover (llena todo sin barras)
  //  - muy distinta         -> contain + fondo desenfocado (no se corta)
  // true  = imágenes muy distintas se muestran completas (con barras desenfocadas)
  // false = SIEMPRE llenan todo el espacio (cover), aunque se recorte un poco
  var FIT_CONTAIN_ENABLED = false;

  function heroFitSlide_(slide){
    var img = slide.querySelector('.hero-bg');
    var box = document.getElementById('heroSection');
    if(!img || !img.naturalWidth || !img.naturalHeight || !box || !box.clientHeight) return;
    var d = (img.naturalWidth / img.naturalHeight) / (box.clientWidth / box.clientHeight);
    var squareArt = slide.getAttribute('data-square-art') === '1' && (img.naturalWidth / img.naturalHeight) < 1.35;
    slide.classList.toggle('fit-contain', squareArt || (FIT_CONTAIN_ENABLED && (d < 0.8 || d > 1.35)));
    // Imagen de baja resolución: sin zoom animado para que no se pixele más
    slide.classList.toggle('low-res', img.naturalWidth < box.clientWidth * 0.85);
  }
  function heroFitAll_(){
    document.querySelectorAll('#heroSection .hero-slide').forEach(heroFitSlide_);
  }
  var heroFitResizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(heroFitResizeTimer);
    heroFitResizeTimer = setTimeout(heroFitAll_, 150);
  });

  function heroGoTo(index){
    var slides = document.querySelectorAll('#heroSection .hero-slide');
    var dots = document.querySelectorAll('#heroSection .hero-dot');
    if(!slides.length) return;

    var prev = heroIndex;
    heroIndex = (index + slides.length) % slides.length;

    slides.forEach(function(s, i){
      s.classList.remove('active','prev');
      if(i === prev && prev !== heroIndex) s.classList.add('prev');
    });
    slides[heroIndex].classList.add('active');

    dots.forEach(function(d, i){ d.classList.toggle('active', i === heroIndex); });
  }

  function heroNext(){ heroGoTo(heroIndex + 1); heroRestartAutoplay(); heroResetProgress(); }
  function heroPrev(){ heroGoTo(heroIndex - 1); heroRestartAutoplay(); heroResetProgress(); }

  function heroScheduleAutoplay(){
    if(heroTimer) clearTimeout(heroTimer);
    heroTimer = setTimeout(function(){
      if(!heroPaused){
        heroGoTo(heroIndex + 1);
        heroResetProgress();
      }
      heroScheduleAutoplay();
    }, heroAutoplayMs);
  }
  function heroRestartAutoplay(){
    if(heroTimer) clearTimeout(heroTimer);
    heroScheduleAutoplay();
  }

  function heroResetProgress(){
    var bar = document.getElementById('heroProgressBar');
    if(!bar) return;
    if(heroProgressTimer) clearInterval(heroProgressTimer);
    if(heroItems.length <= 1){ bar.style.width = '0%'; return; }
    bar.style.width = '0%';
    heroProgressStart = Date.now();
    heroProgressTimer = setInterval(function(){
      if(heroPaused) return;
      var elapsed = Date.now() - heroProgressStart;
      var pct = Math.min(100, (elapsed / heroAutoplayMs) * 100);
      bar.style.width = pct + '%';
      if(pct >= 100){ clearInterval(heroProgressTimer); heroProgressTimer = null; }
    }, 60);
  }

  document.addEventListener('visibilitychange', function(){ heroPaused = document.hidden; });

  // ============================================================
  //  RENDER FILAS
  // ============================================================
  function renderRows(){
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    var wrap = document.getElementById('rowsWrap');
    if(allMedia.length === 0){
      wrap.innerHTML = emptyStateHtml('Aún no hay contenido publicado', 'Cuando el administrador agregue títulos, aparecerán aquí.');
      return;
    }
    if(q){
      var results = allMedia.filter(function(m){
        var hay = (m.nombre+' '+m.categoria+' '+(m.descripcion||'')).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
      wrap.innerHTML = results.length
        ? rowBlockHtml('Resultados de búsqueda', results)
        : emptyStateHtml('No encontramos resultados', 'Prueba con otro título o categoría distinta a "'+q+'".');
      if(results.length) bindRowEnhancements();
      return;
    }
    var byCat = {};
    var order = [];
    allMedia.forEach(function(m){
      var c = m.categoria || 'General';
      if(!byCat[c]){ byCat[c] = []; order.push(c); }
      byCat[c].push(m);
    });
    wrap.innerHTML = order.map(function(cat){ return rowBlockHtml(cat, byCat[cat]); }).join('');
    bindRowEnhancements();
  }

  function bindRowEnhancements(){
    setTimeout(function(){
      document.querySelectorAll('.row-track-wrap').forEach(function(wrap){
        var track = wrap.querySelector('.row-track');
        if(!track) return;

        // Evitar doble binding
        if(wrap.dataset.enhanced) return;
        wrap.dataset.enhanced = '1';

        // === Degradados laterales ===
        function updateFade(){
          var scrollLeft = track.scrollLeft;
          var maxScroll = track.scrollWidth - track.clientWidth;
          wrap.classList.toggle('scroll-left', scrollLeft > 10);
          wrap.classList.toggle('scroll-right', scrollLeft < maxScroll - 10);
        }
        track.addEventListener('scroll', updateFade);
        updateFade();

        // === Drag & drop ===
        var isDown = false;
        var startX = 0;
        var startScroll = 0;
        var moved = false;
        var dragJustEnded = 0;

        track.addEventListener('mousedown', function(e){
          if(e.button !== 0) return;
          isDown = true;
          moved = false;
          startX = e.pageX;
          startScroll = track.scrollLeft;
          track.classList.add('dragging');
        });

        document.addEventListener('mousemove', function(e){
          if(!isDown) return;
          var dx = e.pageX - startX;
          if(Math.abs(dx) > 5) moved = true;
          track.scrollLeft = startScroll - dx;
          e.preventDefault();
        });

        document.addEventListener('mouseup', function(){
          if(!isDown) return;
          isDown = false;
          track.classList.remove('dragging');
          if(moved) dragJustEnded = Date.now();
        });

        // === CLICK EN CARDS — Event Delegation ===
        // Se registra UNA sola vez por track
        if(!track.dataset.clickBound){
          track.dataset.clickBound = '1';

          track.addEventListener('click', function(e){
            // Si acaba de terminar un drag (menos de 100ms), ignorar
            if(Date.now() - dragJustEnded < 100){
              e.preventDefault();
              e.stopPropagation();
              return;
            }
            var card = e.target.closest('.card');
            if(!card) return;
            var mediaId = card.getAttribute('data-media-id');
            if(mediaId && typeof openPlayerById === 'function'){
              e.preventDefault();
              openPlayerById(mediaId);
            }
          });

          track.addEventListener('keydown', function(e){
            if(e.key !== 'Enter' && e.key !== ' ') return;
            var card = e.target.closest('.card');
            if(!card) return;
            var mediaId = card.getAttribute('data-media-id');
            if(mediaId && typeof openPlayerById === 'function'){
              e.preventDefault();
              openPlayerById(mediaId);
            }
          });
        }

        // === Rueda del mouse horizontal ===
        track.addEventListener('wheel', function(e){
          if(e.deltaY !== 0 && !e.shiftKey){
            track.scrollLeft += e.deltaY;
            e.preventDefault();
          }
        }, {passive:false});
      });
    }, 30);
  }

  var rowIdCounter = 0;
  function rowBlockHtml(title, items){
    var rowId = 'row-' + (rowIdCounter++);
    return '' +
      '<div class="row-block">' +
        '<h3 class="row-title">'+esc(title)+'</h3>' +
        '<div class="row-track-wrap">' +
          '<button class="row-arrow left" aria-label="Ver anteriores" data-scroll-row="'+rowId+'" data-dir="-1">‹</button>' +
          '<div class="row-track" id="'+rowId+'">' + items.map(cardHtml).join('') + '</div>' +
          '<button class="row-arrow right" aria-label="Ver siguientes" data-scroll-row="'+rowId+'" data-dir="1">›</button>' +
        '</div>' +
      '</div>';
  }

  // Bind de flechas: una sola vez en document
  document.addEventListener('click', function(e){
    var arrow = e.target.closest('.row-arrow[data-scroll-row]');
    if(!arrow) return;
    var rowId = arrow.getAttribute('data-scroll-row');
    var dir = parseInt(arrow.getAttribute('data-dir'), 10);
    var el = document.getElementById(rowId);
    if(!el) return;
    el.scrollBy({ left: dir * el.clientWidth * 0.85, behavior: 'smooth' });
  });

  function cardHtml(m){
    var inner;
    if(m.miniatura){
      inner = '<img src="'+esc(m.miniatura)+'" loading="lazy" alt="" draggable="false" />';
    } else if(m.tipo === 'image'){
      inner = '<img src="'+esc(m.url)+'" loading="lazy" alt="" draggable="false" />';
    } else {
      var icon = m.tipo === 'video' ? '🎬' : (isAudioType(m.tipo)) ? '🎵' : '📄';
      inner = '<div class="placeholder">'+icon+'</div>';
    }

    var previewAttr = '';
    if(m.tipo === 'video' && m.url && !isHlsUrl(m.url) && !isIcecastUrl(m.url)){
      previewAttr = ' data-preview-url="'+esc(fixDropbox(m.url))+'"';
    }

    var badge = m.destacado ? '<div class="card-badge">★ Destacado</div>' : '';
    var playIcon = m.tipo !== 'image' ?
      '<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' : '';

    // SIN onclick inline, SIN onkeydown inline — binding por delegation
    return '' +
      '<div class="card" tabindex="0" role="button" aria-label="'+esc(m.nombre)+'" title="'+esc(m.nombre)+'" ' +
        'data-media-id="'+esc(m.id)+'"'+previewAttr+'>' +
        badge +
        inner +
        playIcon +
        '<div class="card-overlay">'+esc(m.nombre)+'</div>' +
      '</div>';
  }

  // Quita el shimmer de las miniaturas apenas cargan (no interfiere con el click delegation)
  document.addEventListener('load', function(e){
    if(e.target && e.target.tagName === 'IMG'){
      var card = e.target.closest('.card');
      if(card){
        e.target.classList.add('loaded');
        applyCardFit_(card, e.target);
      }
    }
  }, true);

  // Ajuste de imagen de la card (proporción de la card = 16:9):
  // parecida -> cover; muy distinta -> contain sobre fondo desenfocado.
  function applyCardFit_(card, img){
    var w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h) return;
    var r = (w / h) / (16 / 9);
    if(!FIT_CONTAIN_ENABLED || (r >= 0.8 && r <= 1.25)){ card.classList.remove('fit-contain'); return; }
    var src = (img.currentSrc || img.src || '').replace(/"/g, '%22');
    card.style.setProperty('--card-bg', 'url("' + src + '")');
    card.classList.add('fit-contain');
  }

  // === Vista previa en video al pasar el mouse sobre una card (solo desktop) ===
  var cardPreviewSupported = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var cardPreviewTimer = null;
  var cardPreviewEl = null;
  var cardPreviewCardEl = null;

  function clearCardPreview(){
    if(cardPreviewTimer){ clearTimeout(cardPreviewTimer); cardPreviewTimer = null; }
    if(cardPreviewEl){
      cardPreviewEl.pause();
      cardPreviewEl.remove();
      cardPreviewEl = null;
      cardPreviewCardEl = null;
    }
  }

  if(cardPreviewSupported){
    document.addEventListener('mouseover', function(e){
      var card = e.target.closest('.card');
      if(!card) return;
      if(cardPreviewCardEl === card) return;
      clearCardPreview();
      var url = card.getAttribute('data-preview-url');
      if(!url) return;
      cardPreviewTimer = setTimeout(function(){
        var video = document.createElement('video');
        video.className = 'card-preview-video';
        video.src = url;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = 'none';
        card.appendChild(video);
        video.play().catch(function(){});
        requestAnimationFrame(function(){ video.classList.add('show'); });
        cardPreviewEl = video;
        cardPreviewCardEl = card;
      }, 500);
    });

    document.addEventListener('mouseout', function(e){
      var card = e.target.closest('.card');
      if(!card) return;
      if(card.contains(e.relatedTarget)) return;
      clearCardPreview();
    });
  }

  document.addEventListener('focusin', function(e){
    if(e.target.classList && e.target.classList.contains('card')){
      e.target.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    }
  });

  // ============================================================
  //  REPRODUCTOR
  // ============================================================
  // Punto de entrada público (cards, playlist, botón "Reintentar", etc).
  // No hace el trabajo pesado directamente: primero decide si hay que
  // ignorar el clic (mismo contenido ya abierto, o un cambio ya en
  // curso) y solo entonces detiene por completo lo anterior antes de
  // construir lo nuevo, para que nunca queden dos reproducciones
  // sonando/mostrándose a la vez.
  function openPlayerById(id){
    if(!id) return;
    var m = allMedia.find(function(x){ return x.id === id; });
    if(!m) return;

    // Reingeniería anti-lag: el carrusel de portada queda tapado pero su
    // setInterval de auto-avance seguiría corriendo de fondo mientras se
    // reproduce (y más aún en pantalla completa). Se pausa acá y se
    // reanuda en closePlayer().
    heroPaused = true;

    var overlayOpen = document.getElementById('playerOverlay').classList.contains('open');
    // Ya está abierto exactamente este mismo contenido: un doble clic o
    // clics repetidos sobre la misma card no deben reiniciar ni duplicar
    // la reproducción.
    if(overlayOpen && pcCurrentMedia && pcCurrentMedia.id === m.id) return;

    // Ya hay un cambio de contenido en curso (deteniendo lo anterior):
    // ignoramos clics adicionales hasta que termine.
    if(pcSwitchLock) return;
    pcSwitchLock = true;

    stopCurrentPlayback_(function(){
      pcSwitchLock = false;
      reallyOpenPlayerById_(m);
    });
  }

  // Detiene por completo cualquier motor de reproducción activo (HLS,
  // radio Icecast, <video>/<audio>) y solo llama a "done" cuando ya no
  // queda nada sonando. Así la siguiente reproducción nunca se solapa
  // con la anterior, ni siquiera si el "stop" del motor de radio es
  // asíncrono.
  function stopCurrentPlayback_(done){
    if(currentHls){ try { currentHls.destroy(); } catch(e){} currentHls = null; }

    if(radioPlayerInstance){
      var inst = radioPlayerInstance;
      radioPlayerInstance = null;
      try {
        var result = inst.stop();
        if(result && typeof result.then === 'function'){
          result.then(finishCleanup_, finishCleanup_);
          return;
        }
      } catch(e){}
    }
    finishCleanup_();

    function finishCleanup_(){
      if(pcVideo){
        try { pcVideo.pause(); } catch(e){}
        try { pcVideo.removeAttribute('src'); } catch(e){}
        try { pcVideo.load(); } catch(e){}
        pcVideo = null;
      }
      stopAudioCanvas();
      if(typeof done === 'function') done();
    }
  }

  function reallyOpenPlayerById_(m){
    pcCurrentMedia = m;
    pcIsLive = false;
    pcLastAdAt = Date.now();

    pcPlaylist = buildPlaylistFor_(m);
    pcPlaylistIndex = pcPlaylist.findIndex(function(x){ return x.id === m.id; });

    var url = fixDropbox(m.url);
    var stage = document.getElementById('playerStage');
    var mount = document.getElementById('playerMediaMount');
    var controls = document.getElementById('playerControls');
    var bigPlay = document.getElementById('playerBigPlay');
    var spinner = document.getElementById('playerSpinner');
    var liveInd = document.getElementById('liveIndicator');

    stage.classList.remove('is-image','is-other','is-video','is-audio','is-live','controls-visible');
    bigPlay.classList.remove('show');
    spinner.classList.remove('show');
    liveInd.classList.remove('show');
    controls.style.display = 'none';
    mount.innerHTML = '';

    document.getElementById('playerHeaderTitle').textContent = m.nombre;
    var tipoLabel = m.tipo === 'video' ? 'Video'
                  : isAudioType(m.tipo) ? 'Audio'
                  : m.tipo === 'image' ? 'Imagen'
                  : 'Archivo';
    document.getElementById('playerHeaderMeta').textContent =
      (m.categoria || 'General') + ' · ' + tipoLabel;

    document.getElementById('playerTitle').textContent = m.nombre;
    document.getElementById('playerTitle').title = m.nombre;
    document.getElementById('playerTitle').style.display = isAudioType(m.tipo) ? 'none' : '';
    var descInfo = extractDescImage(m.descripcion);
    document.getElementById('playerDesc').innerHTML = linkifyDescription(descInfo.text);
    var descImgBox = document.getElementById('playerDescImageBox');
    var descImgEl = document.getElementById('playerDescImg');
    if(descInfo.imageUrl){
      descImgEl.onerror = function(){ descImgBox.style.display = 'none'; };
      descImgEl.src = descInfo.imageUrl;
      descImgBox.style.display = '';
    } else {
      descImgBox.style.display = 'none';
      descImgEl.removeAttribute('src');
    }

    var tags = document.getElementById('playerTags');
    tags.innerHTML = m.destacado ? '<span class="player-tag">⭐ Destacado</span>' : '';
    tags.style.display = m.destacado ? '' : 'none';

    if(m.tipo === 'video'){
      playVideo(url, m, stage, mount, controls, bigPlay, spinner, liveInd);
    } else if(isAudioType(m.tipo)){
      playAudio(url, m, stage, mount, controls, spinner);
    } else if(m.tipo === 'image'){
      stage.classList.add('is-image');
      mount.innerHTML = '<img src="'+esc(url)+'" alt="'+esc(m.nombre)+'" />';
    } else {
      stage.classList.add('is-other');
      mount.innerHTML =
        '<div class="player-fallback">' +
          '<div style="font-size:44px;margin-bottom:14px;">📄</div>' +
          '<div>Este contenido no se puede previsualizar aquí.</div>' +
          '<a href="'+esc(url)+'" target="_blank">Abrir archivo en una pestaña nueva ↗</a>' +
        '</div>';
    }

    document.getElementById('playerOverlay').classList.add('open');
    try { pcShowControls(true); } catch(e){}
    try { showMediaToast(m); } catch(e){}
    try { updateMediaSession(m); } catch(e){}
    try { renderPlayerPlaylist(); } catch(e){}
    try { adOnPlayerOpened_(m); } catch(e){}
  }

  // ============================================================
  //  SIGUIENTE / ANTERIOR + AUTOPLAY
  // ============================================================
  function playerNext(){
    if(!pcPlaylist || pcPlaylist.length < 2) return;
    var next = pcPlaylistIndex + 1;
    if(next >= pcPlaylist.length) next = 0;
    var item = pcPlaylist[next];
    if(item) openPlayerById(item.id);
  }

  function playerPrev(){
    if(!pcPlaylist || pcPlaylist.length < 2) return;
    var prev = pcPlaylistIndex - 1;
    if(prev < 0) prev = pcPlaylist.length - 1;
    var item = pcPlaylist[prev];
    if(item) openPlayerById(item.id);
  }

  // Se llama cuando un video/audio termina de reproducirse.
  function playerHandleEnded(){
    if(pcIsLive) return;
    if(pcAutoplayNext && pcPlaylist && pcPlaylist.length > 1){
      playerNext();
    }
  }

  function playerToggleAutoplay(){
    playerSetAutoplay(!pcAutoplayNext);
  }

  function playerSetAutoplay(on){
    pcAutoplayNext = !!on;
    var btn = document.getElementById('pcAutoplayBtn');
    if(btn) btn.classList.toggle('is-off', !pcAutoplayNext);
    var checkbox = document.getElementById('pcAutoplayToggle');
    if(checkbox) checkbox.checked = pcAutoplayNext;
  }

  function renderPlayerPlaylist(){
    var wrap = document.getElementById('playerSidebar');
    var list = document.getElementById('playerPlaylistList');
    var prevBtn = document.getElementById('pcPrevBtn');
    var nextBtn = document.getElementById('pcNextBtn');
    if(!wrap || !list) return;

    var hasQueue = pcPlaylist && pcPlaylist.length > 1;
    if(prevBtn) prevBtn.disabled = !hasQueue;
    if(nextBtn) nextBtn.disabled = !hasQueue;

    var searchInput = document.getElementById('playerPlaylistSearch');
    if(searchInput) searchInput.value = '';

    if(!hasQueue){
      wrap.style.display = 'none';
      list.innerHTML = '';
      return;
    }
    wrap.style.display = '';

    var html = '';
    for(var i = 0; i < pcPlaylist.length; i++){
      var it = pcPlaylist[i];
      var active = pcCurrentMedia && it.id === pcCurrentMedia.id;
      var thumbInner = it.miniatura
        ? '<img src="'+esc(it.miniatura)+'" alt="" loading="lazy" />'
        : '<span>' + (isAudioType(it.tipo) ? '🎵' : it.tipo === 'video' ? '🎬' : '📄') + '</span>';
      var numInner = active
        ? '<svg class="pl-playing-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
        : (i + 1);

      html +=
        '<button type="button" class="player-playlist-item'+(active ? ' is-active' : '')+'" ' +
          'data-media-id="'+esc(it.id)+'" '+(active ? 'disabled' : '')+' aria-current="'+(active ? 'true' : 'false')+'">' +
          '<span class="pl-item-num">'+numInner+'</span>' +
          '<span class="pl-item-thumb">'+thumbInner+'</span>' +
          '<span class="pl-item-info">' +
            '<span class="pl-item-title">'+esc(it.nombre)+'</span>' +
            '<span class="pl-item-sub">'+esc(it.categoria || 'General')+'</span>' +
          '</span>' +
        '</button>';
    }
    list.innerHTML = html;

    if(!list.dataset.clickBound){
      list.dataset.clickBound = '1';
      list.addEventListener('click', function(e){
        var item = e.target.closest('.player-playlist-item');
        if(!item || item.disabled) return;
        var mediaId = item.getAttribute('data-media-id');
        if(!mediaId) return;
        openPlayerById(mediaId);

        // En móvil/tablet el video y la lista quedan uno debajo del
        // otro (mismo breakpoint que ya usa el CSS: <=1080px). Ahí,
        // tras elegir un ítem, subimos la vista hasta el reproductor
        // para que el contenido se vea de una, sin scrollear a mano.
        if(window.innerWidth <= 1080){
          var overlay = document.getElementById('playerOverlay');
          if(overlay){
            if(typeof overlay.scrollTo === 'function'){
              overlay.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
              overlay.scrollTop = 0;
            }
          }
        }
      });
    }

    var activeEl = list.querySelector('.is-active');
    if(activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  // Filtra en tiempo real los ítems de la lista "A continuación"
  // por título o categoría, sin tocar pcPlaylist ni volver a pedir datos.
  function filterPlayerPlaylist(query){
    var list = document.getElementById('playerPlaylistList');
    if(!list) return;
    var q = (query || '').toLowerCase().trim();
    var items = list.querySelectorAll('.player-playlist-item');
    var visibleCount = 0;

    for(var i = 0; i < items.length; i++){
      var item = items[i];
      var titleEl = item.querySelector('.pl-item-title');
      var subEl = item.querySelector('.pl-item-sub');
      var text = ((titleEl ? titleEl.textContent : '') + ' ' + (subEl ? subEl.textContent : '')).toLowerCase();
      var match = !q || text.indexOf(q) !== -1;
      item.style.display = match ? '' : 'none';
      if(match) visibleCount++;
    }

    var empty = list.querySelector('.player-playlist-empty');
    if(!empty){
      empty = document.createElement('div');
      empty.className = 'player-playlist-empty';
      empty.textContent = 'Sin resultados.';
      list.appendChild(empty);
    }
    empty.style.display = (q && visibleCount === 0) ? '' : 'none';
  }

  // ============================================================
  //  MOTOR 1: VIDEO
  // ============================================================
  function playVideo(url, m, stage, mount, controls, bigPlay, spinner, liveInd){
    stage.classList.add('is-video');
    controls.style.display = 'block';

    var v = document.createElement('video');
    v.playsInline = true;
    v.preload = 'metadata';
    v.setAttribute('playsinline','');
    mount.appendChild(v);
    pcVideo = v;

    // Se limpia el menú de calidad del stream anterior; se reconstruye
    // (si corresponde) cuando hls.js entregue los niveles disponibles.
    var qSection = document.getElementById('pcQualitySection');
    if(qSection){ qSection.innerHTML = ''; qSection.style.display = 'none'; }

    if(isHlsUrl(url) && typeof Hls !== 'undefined' && Hls.isSupported()){
      spinner.classList.add('show');
      currentHls = new Hls({ enableWorker:true, lowLatencyMode:true, backBufferLength:90 });
      currentHls.loadSource(url);
      currentHls.attachMedia(v);

      currentHls.on(Hls.Events.MANIFEST_PARSED, function(event, data){
        spinner.classList.remove('show');
        if(data && data.levels && data.levels[0]){
          var isLive = !data.levels[0].details || data.levels[0].details.live === true;
          if(isLive){ pcIsLive = true; stage.classList.add('is-live'); liveInd.classList.add('show'); }
          pcBuildQualityMenu(data.levels);
        }
        var pp = v.play();
        if(pp && pp.catch){
          pp.catch(function(){
            v.muted = true;
            v.volume = 0;
            v.play().catch(function(){});
            document.getElementById('pcVolume').value = 0;
            pcUpdateVolumeIcon();
          });
        }
      });
      currentHls.on(Hls.Events.ERROR, function(event, data){
        if(data.fatal){
          spinner.classList.remove('show');
          showPlayerMediaError(mount, 'No se pudo cargar este canal.', 'Puede estar fuera de línea o el enlace ya no funciona.', m.id);
        }
      });
    }
    else if(isHlsUrl(url) && v.canPlayType('application/vnd.apple.mpegurl')){
      spinner.classList.add('show');
      v.src = url;
      v.addEventListener('loadedmetadata', function(){
        spinner.classList.remove('show');
        if(!isFinite(v.duration)){ pcIsLive = true; stage.classList.add('is-live'); liveInd.classList.add('show'); }
        v.play().catch(function(){});
      });
    }
    else {
      spinner.classList.add('show');
      v.src = url;
      v.addEventListener('loadedmetadata', function(){
        if(!isFinite(v.duration)){ pcIsLive = true; stage.classList.add('is-live'); liveInd.classList.add('show'); }
        else { document.getElementById('pcDuration').textContent = fmtTime(v.duration); }
        spinner.classList.remove('show');
      });
      var pp = v.play();
      if(pp && pp.catch){
        pp.catch(function(){
          v.muted = true;
          v.volume = 0;
          v.play().catch(function(){});
          document.getElementById('pcVolume').value = 0;
          pcUpdateVolumeIcon();
        });
      }
    }

    v.addEventListener('timeupdate', pcUpdateProgress);
    v.addEventListener('progress', pcUpdateBuffer);
    v.addEventListener('play', function(){
      pcSetPlayIcon(true);
      bigPlay.classList.remove('show');
      if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'playing'; }catch(e){} }
    });
    v.addEventListener('pause', function(){
      pcSetPlayIcon(false);
      bigPlay.classList.add('show');
      if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'paused'; }catch(e){} }
    });
    v.addEventListener('waiting', function(){ spinner.classList.add('show'); });
    v.addEventListener('playing', function(){ spinner.classList.remove('show'); });
    v.addEventListener('ended', function(){
      pcSetPlayIcon(false);
      bigPlay.classList.add('show');
      if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'none'; }catch(e){} }
      playerHandleEnded();
    });
    v.addEventListener('error', function(){
      spinner.classList.remove('show');
      showPlayerMediaError(mount, 'No se pudo cargar el video.', 'El archivo puede no estar disponible o el enlace ya no funciona.', m.id);
    });

    pcBindProgressEvents();
  }

  // Aviso de error dentro del reproductor: mensaje + botón "Reintentar"
  // en vez de un enlace a la URL cruda (que podía sacar al usuario
  // del sistema al abrirse en algunos navegadores/apps móviles).
  function showPlayerMediaError(mount, title, subtitle, mediaId){
    mount.innerHTML =
      '<div class="player-media-error">' +
        '<span class="pme-icon">⚠️</span>' +
        esc(title) +
        (subtitle ? '<div class="pme-sub">' + esc(subtitle) + '</div>' : '') +
        (mediaId ? '<button type="button" onclick="openPlayerById(\'' + esc(mediaId) + '\')">Reintentar</button>' : '') +
      '</div>';
  }

  // ============================================================
  //  MOTOR 2: AUDIO
  // ============================================================
  function playAudio(url, m, stage, mount, controls, spinner){
    stage.classList.add('is-audio');
    controls.style.display = 'block';

    var coverInner = m.miniatura
      ? '<img src="'+esc(m.miniatura)+'" alt="" />'
      : '<span class="audio-icon-fallback">🎵</span>';

    mount.innerHTML =
      '<div class="audio-content">' +
        '<div class="audio-cover-wrap">' +
          '<div class="audio-cover" id="audioCover">' +
            coverInner +
          '</div>' +
        '</div>' +
        '<div class="audio-now-playing" id="audioNowPlaying"></div>' +
      '</div>';

    var useIcecast = isIcecastUrl(url);

    if(useIcecast && typeof IcecastMetadataPlayer !== 'undefined'){
      spinner.classList.add('show');
      radioPendingPlay_ = false;
      var radioInst = null;
      try {
        radioInst = radioPlayerInstance = new IcecastMetadataPlayer(url, {
          onMetadata: function(metadata){
            if(radioPlayerInstance !== radioInst) return;
            var el = document.getElementById('audioNowPlaying');
            if(el && metadata && metadata.StreamTitle){
              el.textContent = '♪ ' + metadata.StreamTitle;
              var toastT = document.getElementById('mediaToastTitle');
              if(toastT && pcCurrentMedia) toastT.textContent = metadata.StreamTitle;
            }
          },
          onError: function(error){
            // Una instancia vieja (ya cerrada o reemplazada) no debe
            // arrancar un audio de respaldo encima del actual.
            if(radioPlayerInstance !== radioInst) return;
            console.warn('Error Icecast:', error);
            spinner.classList.remove('show');
            tryNativeAudio(url, m, stage, mount, spinner);
          },
          onLoad: function(){
            if(radioPlayerInstance !== radioInst) return;
            spinner.classList.remove('show');
            pcIsLive = true;
            stage.classList.add('is-live');
          },
          // La radio no tenía NINGÚN evento de play/stop conectado: el
          // ícono, el botón grande y la carátula nunca reflejaban el
          // estado real del stream.
          onPlay: function(){
            if(radioPlayerInstance !== radioInst) return;
            spinner.classList.remove('show');
            pcSyncPlayUi_(true);
          },
          onStop: function(){
            if(radioPlayerInstance !== radioInst) return;
            if(radioPendingPlay_){
              radioPendingPlay_ = false;
              try {
                var rp = radioInst.play();
                if(rp && rp.catch) rp.catch(function(){});
              } catch(e){}
              return;
            }
            pcSyncPlayUi_(false);
          },
          playbackMethod: ["html5", "mediasource", "webaudio"]
        });
        var firstPlay = radioInst.play();
        if(firstPlay && firstPlay.catch) firstPlay.catch(function(){});
      } catch(e){
        console.warn('Icecast fallback:', e);
        tryNativeAudio(url, m, stage, mount, spinner);
      }
    } else {
      tryNativeAudio(url, m, stage, mount, spinner);
    }

    startAudioCanvas();
  }

  function tryNativeAudio(url, m, stage, mount, spinner){
    // Si ya hay un <video> nativo para este audio, no se crea otro (el
    // motor de radio puede avisar el error más de una vez).
    if(pcVideo) return;

    // ARREGLO PAUSA: cuando Icecast fallaba y se caía al reproductor
    // nativo, radioPlayerInstance seguía existiendo. playerTogglePlay()
    // ve esa instancia y manda play/pausa a la radio muerta en vez de
    // al <video> que realmente está sonando → la pausa no hacía nada.
    if(radioPlayerInstance){
      var deadRadio = radioPlayerInstance;
      radioPlayerInstance = null;
      radioPendingPlay_ = false;
      try {
        var dr = deadRadio.stop();
        if(dr && dr.catch) dr.catch(function(){});
      } catch(e){}
    }

    var v = document.createElement('video');
    v.playsInline = true;
    v.preload = 'metadata';
    v.setAttribute('playsinline','');
    v.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
    mount.appendChild(v);
    pcVideo = v;

    spinner.classList.add('show');
    v.src = url;

    v.addEventListener('loadedmetadata', function(){
      spinner.classList.remove('show');
      if(!isFinite(v.duration)){
        pcIsLive = true;
        stage.classList.add('is-live');
        document.getElementById('liveIndicator').classList.add('show');
      } else {
        document.getElementById('pcDuration').textContent = fmtTime(v.duration);
      }
    });
    // ARREGLO PAUSA: "canplay" se dispara de nuevo cada vez que el
    // navegador se recupera de un buffering o tras un seek. Antes, cada
    // vez llamaba v.play() y el audio se reanudaba solo después de que
    // el usuario lo había pausado (según el formato/servidor ocurría
    // más o menos seguido). El arranque automático es solo la 1ª vez.
    var autoStarted = false;
    v.addEventListener('canplay', function(){
      spinner.classList.remove('show');
      if(autoStarted) return;
      autoStarted = true;
      v.play().catch(function(){
        v.muted = true;
        v.volume = 0;
        v.play().catch(function(){});
        document.getElementById('pcVolume').value = 0;
        pcUpdateVolumeIcon();
      });
    });
    v.addEventListener('error', function(){
      spinner.classList.remove('show');
      var el = document.getElementById('audioNowPlaying');
      if(el) el.textContent = 'No se pudo cargar el audio.';
    });

    attachAudioEvents(v, stage, mount, spinner);
    pcBindProgressEvents();
  }

  function attachAudioEvents(v, stage, mount, spinner){
    v.addEventListener('timeupdate', pcUpdateProgress);
    v.addEventListener('progress', pcUpdateBuffer);
    v.addEventListener('play', function(){
      pcSetPlayIcon(true);
      document.getElementById('playerBigPlay').classList.remove('show');
      var cover = document.getElementById('audioCover');
      if(cover) cover.classList.add('spinning');
      if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'playing'; }catch(e){} }
    });
    v.addEventListener('pause', function(){
      pcSetPlayIcon(false);
      document.getElementById('playerBigPlay').classList.add('show');
      var cover = document.getElementById('audioCover');
      if(cover) cover.classList.remove('spinning');
      if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = 'paused'; }catch(e){} }
    });
    v.addEventListener('playing', function(){ spinner.classList.remove('show'); });
    v.addEventListener('waiting', function(){ spinner.classList.add('show'); });
    v.addEventListener('ended', function(){
      pcSetPlayIcon(false);
      document.getElementById('playerBigPlay').classList.add('show');
      var cover = document.getElementById('audioCover');
      if(cover) cover.classList.remove('spinning');
      playerHandleEnded();
    });
  }

  // ============================================================
  //  CANVAS DE ONDAS
  // ============================================================
  function startAudioCanvas(){
    // Anti-lag: si ya había una animación corriendo (audio anterior sin
    // cerrar del todo), se detiene primero. Sin esto, cada reproducción
    // de audio sumaba un bucle requestAnimationFrame y un listener de
    // resize nuevos que nunca se liberaban, acumulándose sesión tras
    // sesión y volviendo todo cada vez más lento.
    stopAudioCanvas();

    var canvas = document.getElementById('audioCanvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');

    // 3 manchas de luz (verde acento, rojo de marca, violeta de contraste)
    // que orbitan y respiran muy lento, como una aurora detrás de la
    // carátula. Nada de barras: solo color y movimiento suave.
    var BLOBS = [
      { color:[29,185,84],  radius:0.56, orbit:0.20, speed:0.11, phase:0.0 },
      { color:[229,9,20],   radius:0.50, orbit:0.24, speed:0.08, phase:2.1 },
      { color:[124,58,237], radius:0.42, orbit:0.17, speed:0.15, phase:4.4 }
    ];

    function resize(){
      var dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    audioCanvasResizeHandler = resize;
    window.addEventListener('resize', audioCanvasResizeHandler);

    // Cuando está en pausa, el reloj de la animación se congela en vez de
    // seguir avanzando: las manchas quedan quietas, no solo "más lentas".
    var frozenAt = null;

    function draw(){
      var w = canvas.offsetWidth;
      var h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      var playing = pcIsPlaying_();
      if(!playing && frozenAt === null) frozenAt = Date.now();
      if(playing) frozenAt = null;
      var time = (playing ? Date.now() : frozenAt) / 1000;

      var intensity = playing ? 1 : 0.4;
      var base = Math.min(w, h);
      var cx = w / 2, cy = h * 0.4;

      ctx.globalCompositeOperation = 'lighter';
      for(var i=0; i<BLOBS.length; i++){
        var b = BLOBS[i];
        var ang = time * b.speed + b.phase;
        var orbit = base * b.orbit;
        var x = cx + Math.cos(ang) * orbit * 1.3;
        var y = cy + Math.sin(ang * 0.8) * orbit;

        // "Respiración": el radio pulsa despacio en vez de mantenerse fijo.
        var pulse = 0.88 + Math.sin(time * 0.6 + b.phase) * 0.12;
        var rad = base * b.radius * pulse;

        var c = b.color;
        var grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
        grad.addColorStop(0,   'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.5 * intensity)+')');
        grad.addColorStop(0.5, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.2 * intensity)+')');
        grad.addColorStop(1,   'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      audioCanvasAnim = requestAnimationFrame(draw);
    }
    draw();
  }
  function stopAudioCanvas(){
    if(audioCanvasAnim){ cancelAnimationFrame(audioCanvasAnim); audioCanvasAnim = null; }
    if(audioCanvasResizeHandler){ window.removeEventListener('resize', audioCanvasResizeHandler); audioCanvasResizeHandler = null; }
    var c = document.getElementById('audioCanvas');
    if(c){
      var ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
    }
  }

  // ------------------------------------------------------------
  // REINGENIERÍA anti-lag en pantalla completa
  // ------------------------------------------------------------
  // Causa raíz: este listener corría en CADA evento "mousemove" crudo
  // (que en mouses/trackpads de alta frecuencia puede disparar muchas
  // más veces por segundo que los 60fps del video). Cada disparo hacía
  // dos recorridos del DOM (stage.contains + target.closest) y
  // reseteaba un setTimeout. En ventana normal el cursor solo está
  // sobre el player parte del tiempo; en pantalla completa el cursor
  // SIEMPRE está sobre el video, así que este trabajo pasaba de
  // ocasional a constante, compitiendo por el hilo principal justo
  // con la decodificación/composición del video → eso era el lag.
  // Fix: agrupar el trabajo a máximo 1 vez por frame con
  // requestAnimationFrame, que es imperceptible para el usuario pero
  // recorta el costo real en 1-2 órdenes de magnitud.
  var pcMouseMovePending = false;
  document.addEventListener('mousemove', function(e){
    if(pcMouseMovePending) return;
    pcMouseMovePending = true;
    requestAnimationFrame(function(){
      pcMouseMovePending = false;
      var stage = document.getElementById('playerStage');
      if(!stage || !stage.contains(e.target)) return;
      if(e.target.closest('.player-controls')){
        if(pcHideTimer) clearTimeout(pcHideTimer);
        return;
      }
      pcShowControls(true);
    });
  });

  document.addEventListener('touchstart', function(e){
    var stage = document.getElementById('playerStage');
    if(!stage || !stage.contains(e.target)) return;
    pcShowControls(true);
  }, {passive:true});

  document.addEventListener('keydown', function(){
    var overlay = document.getElementById('playerOverlay');
    if(!overlay || !overlay.classList.contains('open')) return;
    pcShowControls(true);
  });

  document.addEventListener('fullscreenchange', function(){
    var stage = document.getElementById('playerStage');
    if(!stage) return;
    if(document.fullscreenElement === stage){
      pcShowControls(true);
    } else {
      if(pcHideTimer){ clearTimeout(pcHideTimer); pcHideTimer = null; }
      stage.classList.add('controls-visible');
    }
  });

  // ============================================================

  function updateMediaSession(media){
    if(!('mediaSession' in navigator)) return;
    try{
      var isAudio = media.tipo === 'audio' || media.tipo === 'audio.';
      navigator.mediaSession.metadata = new MediaMetadata({
        title: media.nombre || 'Reproduciendo',
        artist: media.categoria || brandName_,
        album: brandSubname_,
        artwork: media.miniatura ? [{ src: media.miniatura, sizes: '512x512', type: 'image/jpeg' }] : []
      });

      try{ navigator.mediaSession.setActionHandler('play', function(){ playerPlay(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('pause', function(){ playerPause(); }); }catch(e){}
      try{ navigator.mediaSession.setActionHandler('stop', function(){ closePlayer(); }); }catch(e){}
      try{
        navigator.mediaSession.setActionHandler('seekbackward', function(){
          if(pcVideo && !pcIsLive) playerSkip(-10);
        });
      }catch(e){}
      try{
        navigator.mediaSession.setActionHandler('seekforward', function(){
          if(pcVideo && !pcIsLive) playerSkip(10);
        });
      }catch(e){}
      try{
        navigator.mediaSession.setActionHandler('previoustrack', function(){
          if(pcPlaylist && pcPlaylist.length > 1) playerPrev();
        });
      }catch(e){}
      try{
        navigator.mediaSession.setActionHandler('nexttrack', function(){
          if(pcPlaylist && pcPlaylist.length > 1) playerNext();
        });
      }catch(e){}

      navigator.mediaSession.playbackState = 'playing';
    } catch(e){
      console.warn('MediaSession no disponible:', e);
    }
  }

  function clearMediaSession(){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.playbackState = 'none';
      navigator.mediaSession.metadata = null;
    } catch(e){}
  }

  // ============================================================
  //  CONTROLES DEL REPRODUCTOR
  // ============================================================
  // Estado real de reproducción, sea radio Icecast o <video>/<audio>.
  // ARREGLO PAUSA: IcecastMetadataPlayer NO tiene el método isPlaying()
  // (el código anterior lo llamaba igual), así que "playing" siempre
  // daba falso: el botón siempre mandaba play() y nunca detenía la
  // radio. Su estado real está en la propiedad .state.
  function pcIsPlaying_(){
    if(radioPlayerInstance){
      var st = radioPlayerInstance.state;
      return radioPendingPlay_ || (st !== 'stopped' && st !== 'stopping');
    }
    return !!(pcVideo && !pcVideo.paused && !pcVideo.ended);
  }
  function playerPause(){
    if(radioPlayerInstance){
      radioPendingPlay_ = false;
      pcSyncPlayUi_(false);
      try {
        var rs = radioPlayerInstance.stop();
        if(rs && rs.catch) rs.catch(function(){});
      } catch(e){}
      return;
    }
    if(!pcVideo) return;
    try { pcVideo.pause(); } catch(e){}
  }
  function playerPlay(){
    if(typeof adState_ !== 'undefined' && adState_.active) return;   // durante un anuncio no se reanuda el contenido
    if(radioPlayerInstance){
      var st = radioPlayerInstance.state;
      if(st === 'stopped'){
        pcSyncPlayUi_(true);
        try {
          var rp = radioPlayerInstance.play();
          if(rp && rp.catch) rp.catch(function(){});
        } catch(e){}
      } else if(st === 'stopping'){
        // Todavía se está deteniendo: onStop volverá a arrancarla.
        radioPendingPlay_ = true;
        pcSyncPlayUi_(true);
      }
      return;
    }
    if(!pcVideo) return;
    try {
      var pp = pcVideo.play();
      if(pp && pp.catch) pp.catch(function(){});
    } catch(e){}
  }
  function playerTogglePlay(){
    if(!radioPlayerInstance && !pcVideo) return;
    if(pcIsPlaying_()) playerPause(); else playerPlay();
  }
  function pcSetPlayIcon(isPlaying){
    var icon = document.getElementById('pcPlayIcon');
    if(!icon) return;
    icon.innerHTML = isPlaying
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }
  // Refleja el estado de reproducción en toda la interfaz (usado por la
  // radio, que no dispara los eventos play/pause de un <video>).
  function pcSyncPlayUi_(isPlaying){
    pcSetPlayIcon(isPlaying);
    var bp = document.getElementById('playerBigPlay');
    if(bp) bp.classList.toggle('show', !isPlaying);
    var cover = document.getElementById('audioCover');
    if(cover) cover.classList.toggle('spinning', isPlaying);
    if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused'; }catch(e){} }
  }
  function playerSkip(sec){
    if(!pcVideo || pcIsLive) return;
    pcVideo.currentTime = Math.max(0, Math.min(pcVideo.duration || 0, pcVideo.currentTime + sec));
  }
  function playerToggleMute(){
    if(radioPlayerInstance){
      try {
        var ae = radioPlayerInstance.audioElement;
        if(ae){ ae.muted = !ae.muted; document.getElementById('pcVolume').value = ae.muted ? 0 : ae.volume; }
      } catch(e){}
      pcUpdateVolumeIcon();
      return;
    }
    if(!pcVideo) return;
    pcVideo.muted = !pcVideo.muted;
    pcUpdateVolumeIcon();
    document.getElementById('pcVolume').value = pcVideo.muted ? 0 : pcVideo.volume;
  }
  function playerSetVolume(val){
    val = parseFloat(val);
    var slider = document.getElementById('pcVolume');
    if(slider) slider.value = val;
    if(radioPlayerInstance){
      try {
        var ae = radioPlayerInstance.audioElement;
        if(ae){ ae.volume = val; ae.muted = val === 0; }
      } catch(e){}
      pcUpdateVolumeIcon();
      return;
    }
    if(!pcVideo) return;
    pcVideo.volume = val;
    pcVideo.muted = val === 0;
    pcUpdateVolumeIcon();
  }
  function pcUpdateVolumeIcon(){
    var icon = document.getElementById('pcVolIcon');
    if(!icon) return;
    var muted = false, vol = 1;
    if(radioPlayerInstance){
      try {
        var ae = radioPlayerInstance.audioElement;
        if(ae){ vol = ae.volume; muted = ae.muted || vol === 0; }
      } catch(e){}
    } else if(pcVideo){ vol = pcVideo.volume; muted = pcVideo.muted || vol === 0; }
    if(muted){
      icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3l2.5-2.5-1.4-1.4-2.5 2.5-2.5-2.5-1.4 1.4 2.5 2.5-2.5 2.5 1.4 1.4 2.5-2.5 2.5 2.5 1.4-1.4-2.5-2.5z"/>';
    } else if(vol < 0.5){
      icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
    } else {
      icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
    }
  }
  // ------------------------------------------------------------
  // Selector manual de calidad (hls.js). No reemplaza el reproductor:
  // usa el mismo <video> nativo y el mismo hls.js que ya tenías, solo
  // le da al usuario control sobre cuántos píxeles le pide decodificar
  // al dispositivo. Útil cuando "Automática" elige más calidad de la
  // que el equipo puede decodificar sin trabarse, sobre todo en
  // pantalla completa.
  function pcBuildQualityMenu(levels){
    var section = document.getElementById('pcQualitySection');
    if(!section) return;
    if(!levels || levels.length < 2){
      // Un solo nivel disponible: no tiene sentido mostrar el selector.
      section.innerHTML = '';
      section.style.display = 'none';
      return;
    }
    // Se ordena de mayor a menor resolución para que se lea de forma
    // natural (más nítido arriba, más liviano abajo).
    var order = levels.map(function(lv, i){ return i; })
      .sort(function(a,b){ return (levels[b].height||0) - (levels[a].height||0); });

    var html = '<div class="pc-settings-label">Calidad</div>';
    html += '<button class="pc-quality-item pc-settings-item active" data-level="-1" onclick="pcSetQuality(-1,this)">Automática <span class="pc-check">✓</span></button>';
    order.forEach(function(i){
      var lv = levels[i];
      var label = lv.height ? (lv.height + 'p') : ((Math.round((lv.bitrate||0)/1000)) + ' kbps');
      html += '<button class="pc-quality-item pc-settings-item" data-level="'+i+'" onclick="pcSetQuality('+i+',this)">'+label+' <span class="pc-check"></span></button>';
    });
    section.innerHTML = html;
    section.style.display = 'block';
  }
  function pcSetQuality(levelIndex, btnEl){
    if(!currentHls) return;
    currentHls.currentLevel = levelIndex; // -1 = vuelve al modo automático de hls.js
    document.querySelectorAll('.pc-quality-item').forEach(function(b){
      var on = b === btnEl;
      b.classList.toggle('active', on);
      var check = b.querySelector('.pc-check');
      if(check) check.textContent = on ? '✓' : '';
    });
    document.getElementById('pcSettingsMenu').classList.remove('open');
  }
  function playerSetSpeed(sp){
    if(!pcVideo || radioPlayerInstance) return;
    pcVideo.playbackRate = sp;
    document.querySelectorAll('.pc-settings-item').forEach(function(b){
      var on = parseFloat(b.dataset.speed) === sp;
      b.classList.toggle('active', on);
      var check = b.querySelector('.pc-check');
      if(check) check.textContent = on ? '✓' : '';

    document.getElementById('pcSettingsMenu').classList.remove('open');

  function positionSettingsMenu(btn, menu){
    var r = btn.getBoundingClientRect();
    var margin = 8;
    // Se mide el menú ya visible (pero fuera de pantalla) para saber su
    // tamaño real antes de decidir dónde ubicarlo.
    menu.style.visibility = 'hidden';
    menu.style.display = 'block';
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = r.right - mw;
    if(left < margin) left = margin;
    if(left + mw > window.innerWidth - margin) left = window.innerWidth - margin - mw;
    var top = r.top - mh - margin;
    if(top < margin) top = r.bottom + margin; // si no entra arriba, se muestra abajo
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.style.display = '';
    menu.style.visibility = '';
  }
  function playerToggleSettings(ev){
    ev.stopPropagation();
    var menu = document.getElementById('pcSettingsMenu');
    var opening = !menu.classList.contains('open');
    if(opening) positionSettingsMenu(ev.currentTarget, menu);
    menu.classList.toggle('open', opening);
  }
  window.addEventListener('resize', function(){
    var menu = document.getElementById('pcSettingsMenu');
    var btn = menu && menu.parentElement ? menu.parentElement.querySelector('.pc-btn') : null;
    if(menu && btn && menu.classList.contains('open')) positionSettingsMenu(btn, menu);
