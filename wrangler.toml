# Configuración para Cloudflare Workers. Vercel ignora este archivo.
# APPS_SCRIPT_URL y APPS_SCRIPT_SECRET NO se escriben aquí (no subas claves al repositorio):
#   npx wrangler secret put APPS_SCRIPT_URL
#   npx wrangler secret put APPS_SCRIPT_SECRET
name = "zymargo"
main = "worker.js"
compatibility_date = "2026-01-01"
# nodejs_compat: crypto (AES-GCM), stream, Buffer y process.env que usan lib/ y api/.
compatibility_flags = ["nodejs_compat"]

# Importante con despliegue desde Git: sin esto, cada deploy BORRA las variables de tipo "Texto"
# puestas en el panel de Cloudflare (los Secrets no se borran). Aquí no se definen variables.
keep_vars = true

# /public (iconos) se sirve como archivos estáticos, igual que en Vercel.
[assets]
directory = "./public"
binding = "ASSETS"
